<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宝宝巴士｜内容编辑台</title>
  <style>
    :root{--ink:#eff0e8;--muted:#a3aaa7;--bg:#0a1217;--panel:#101d22;--line:#31454a;--gold:#eec46e;--red:#db785f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.shell{max-width:1100px;margin:auto;padding:26px 22px 70px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{margin:0 0 9px;color:var(--gold);font:11px monospace;letter-spacing:.2em}.top h1{margin:0;font:600 clamp(31px,5vw,54px)/1.1 "Songti SC",serif}.top p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 15px;cursor:pointer;font-size:12px;letter-spacing:.08em}.btn.primary{background:var(--gold);color:#173037;border-color:var(--gold)}.mobile-section{display:none}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;margin-top:28px}.steps{position:sticky;top:18px;height:max-content;border-left:1px solid var(--line)}.step{display:block;width:100%;padding:12px 14px;border:0;border-left:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-size:13px}.step.active{border-left-color:var(--gold);color:var(--ink);background:#18272c}.work h2{margin:0 0 8px;font:600 28px "Songti SC",serif}.work>p{margin:0 0 20px;color:var(--muted);font-size:13px}.slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.slot{border:1px solid var(--line);background:var(--panel);padding:14px;min-height:205px}.slot.current{border-color:var(--gold);box-shadow:inset 0 0 0 1px #eec46e33}.slot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.slot-head b{font-size:13px}.slot-head span{color:var(--gold);font:11px monospace}.image-box{height:95px;position:relative;display:grid;place-items:center;overflow:hidden;background:#182b31;border:1px dashed #567076;background-size:cover;background-position:center}.image-box.has{border-style:solid}.image-box button{border:0;background:#eec46e;color:#19343a;padding:8px 10px;font-size:12px;pointer-events:none}.image-box input{position:absolute;z-index:3;inset:0;opacity:0;cursor:pointer}.image-box em{font-style:normal;color:#b9c5c2;font-size:12px;pointer-events:none}.slot textarea{width:100%;height:62px;resize:vertical;margin-top:10px;padding:9px;border:1px solid #3a5358;background:#0b1418;color:var(--ink);font:12px/1.6 inherit}.bottom-tip{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px;line-height:1.8}.status{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,30px);opacity:0;background:#eec46e;color:#183339;padding:10px 15px;font-size:12px;transition:.25s}.status.show{transform:translate(-50%,0);opacity:1}@media(max-width:700px){.shell{padding:20px 14px 56px}.top{display:block}.actions{margin-top:18px}.mobile-section{display:block;width:100%;margin-top:18px;padding:13px;border:1px solid var(--gold);border-radius:0;background:#15262c;color:var(--ink);font:15px inherit}.layout{display:block}.steps{display:none}.slot-grid{grid-template-columns:1fr}.slot{min-height:190px}.image-box{height:auto;min-height:115px;padding:12px;align-content:end}.image-box input{position:static;z-index:auto;opacity:1;width:100%;color:var(--ink);font-size:13px}.image-box button{display:none}.image-box em{position:absolute;top:14px;left:0;right:0;text-align:center}.image-box.has input{background:#0d171b99;padding:7px}.slot textarea{font-size:16px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">MEMORY CONTENT EDITOR</p><h1>把照片和话，放回它们该在的位置。</h1><p>这里编辑，纪念网页本身不会出现输入框。</p></div><div class="actions"><button id="preview" class="btn">预览观看页</button><button id="export" class="btn primary">导出可分享网页</button></div></header>
    <select id="mobileSection" class="mobile-section" aria-label="选择编辑部分"></select><div class="layout"><nav id="steps" class="steps"></nav><section class="work"><h2 id="sectionTitle"></h2><p id="sectionCopy"></p><div id="slotGrid" class="slot-grid"></div><p class="bottom-tip">照片和文字只保存在当前浏览器，点击“导出可分享网页”后会得到一个独立 HTML 文件。把它发给别人即可，里面的照片和文字不会再显示编辑输入框。</p></section></div>
  </main><div id="status" class="status"></div>
  <script>
    const sections=[
      {id:'opening',name:'故事的开始',copy:'先写一句开场语，再放两张把人带进夜班车的照片。',fields:[['openingWords','开场语','例如：那晚以后，我们有了一趟只属于彼此的车。']],slots:[['A','开场 A'],['B','开场 B']]},
      {id:'together',name:'天地一方',copy:'七张照片，写下同一段时光里的七个片段。',slots:[[1,'图片 01'],[2,'图片 02'],[3,'图片 03'],[4,'图片 04 / 可翻票根'],[5,'图片 05'],[6,'图片 06'],[7,'图片 07']]},
      {id:'apart',name:'天各一方',copy:'九张照片，从另一座城市一路走到汇合。',slots:[[8,'图片 08'],[9,'图片 09'],[10,'图片 10'],[11,'图片 11'],[12,'图片 12'],[13,'图片 13'],[14,'图片 14 / 双画面'],[15,'图片 15 / 车票'],[16,'图片 16 / 汇合']]},
      {id:'ending',name:'下一站',copy:'最后留给未来的两句话。',fields:[['endingTitle','结束标题','例如：下一站：幸福'],['endingWords','结束语','例如：愿我们把以后的每一站，都坐成同一趟车。']],slots:[]}
    ];
    const $=id=>document.getElementById(id);let data={images:{},text:{}};let active='opening';
    try{data=Object.assign(data,JSON.parse(localStorage.getItem('baby-bus-memory-data')||'{}'));data.images||={};data.text||={}}catch{}
    const save=()=>localStorage.setItem('baby-bus-memory-data',JSON.stringify(data));
    const toast=message=>{$('status').textContent=message;$('status').classList.add('show');setTimeout(()=>$('status').classList.remove('show'),1700)};
      function render(){
        $('steps').innerHTML=sections.map(s=>`<button class="step ${s.id===active?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');
        $('mobileSection').innerHTML=sections.map(s=>`<option value="${s.id}" ${s.id===active?'selected':''}>${s.name}</option>`).join('');
      const section=sections.find(s=>s.id===active);$('sectionTitle').textContent=section.name;$('sectionCopy').textContent=section.copy;
      const textFields=(section.fields||[]).map(([key,label,placeholder])=>`<article class="slot"><div class="slot-head"><b>${label}</b><span>文字</span></div><textarea data-text="${key}" placeholder="${placeholder}">${data.text[key]||''}</textarea></article>`).join('');
      const photoFields=section.slots.map(([id,label])=>{const key=String(id),image=data.images[key]||'',text=data.text[key]||'';return `<article class="slot"><div class="slot-head"><b>${label}</b><span>${image?'已放照片':'待放照片'}</span></div><label class="image-box ${image?'has':''}" style="${image?`background-image:url('${image}')`:''}"><input type="file" accept="image/*" data-image="${key}"><button type="button">${image?'更换照片':'选择照片'}</button>${image?'':'<em>照片将显示在这里</em>'}</label><textarea data-text="${key}" placeholder="填写这张照片想说的话">${text}</textarea></article>`}).join('');
      $('slotGrid').innerHTML=textFields+photoFields;
    }
    $('steps').addEventListener('click',e=>{const btn=e.target.closest('[data-id]');if(!btn)return;active=btn.dataset.id;render()});
    $('mobileSection').addEventListener('change',e=>{active=e.target.value;render()});
    $('slotGrid').addEventListener('input',e=>{if(!e.target.matches('textarea'))return;data.text[e.target.dataset.text]=e.target.value;save()});
    $('slotGrid').addEventListener('change',e=>{const input=e.target;if(!input.matches('input[type=file]')||!input.files[0])return;const reader=new FileReader;reader.onload=()=>{data.images[input.dataset.image]=reader.result;save();render();toast('照片已放入这一站')};reader.readAsDataURL(input.files[0])});
    $('preview').addEventListener('click',()=>{save();window.location.href='baby-bus-memory-final.html?preview=1'});
    $('export').addEventListener('click',()=>{save();const injection=`<script>window.MEMORY_DATA=${JSON.stringify(data).replace(/</g,'\\u003c')}<\\/script>`;const html=window.__VIEW_TEMPLATE__.replace('<script>',injection+'<script>');const blob=new Blob([html],{type:'text/html;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='宝宝巴士-纪念日网页.html';link.click();URL.revokeObjectURL(link.href);toast('已导出：把下载的 HTML 发给对方即可')});
    render();
  </script>
  <script>window.__VIEW_TEMPLATE__="\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  \u003ctitle>宝宝巴士 | 记忆之旅\u003c/title>\n  \u003cstyle>\n    :root { --ink:#f8f1e4; --muted:#b7b9b5; --night:#071015; --night2:#0c1a20; --gold:#f2c56b; --line:rgba(248,241,228,.24); }\n    * { box-sizing:border-box; }\n    html { scroll-behavior:smooth; background:var(--night); }\n    body { margin:0; color:var(--ink); background:var(--night); font-family:\"Microsoft YaHei\",\"PingFang SC\",sans-serif; overflow-x:hidden; }\n    button,input { font:inherit; }\n    .chapter { min-height:100svh; position:relative; overflow:hidden; }\n    .chapter[hidden] { display:none; }\n    .grain { position:fixed; z-index:20; pointer-events:none; inset:0; opacity:.055; background-image:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 5px); mix-blend-mode:soft-light; }\n    .stars { position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle at 9% 17%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 83% 14%,#f2c56b 0 1px,transparent 1.7px),radial-gradient(circle at 68% 82%,#fff 0 1px,transparent 1.7px),radial-gradient(circle at 22% 67%,#f2c56b 0 1px,transparent 1.9px); background-size:230px 230px,310px 310px,280px 280px,360px 360px; opacity:.65; animation:stars 8s linear infinite; }\n    @keyframes stars { to { background-position:230px -230px,-310px 310px,280px -280px,-360px 360px; } }\n    .eyebrow { margin:0 0 14px; font-size:11px; letter-spacing:.24em; color:var(--gold); }\n    .display { font-family:\"Songti SC\",\"STSong\",serif; letter-spacing:.05em; font-weight:600; }\n    .copy { color:var(--muted); font-size:14px; line-height:1.85; }\n    .action { appearance:none; cursor:pointer; border:1px solid rgba(242,197,107,.7); color:#1d2a2c; background:var(--gold); border-radius:0; padding:13px 18px; font-size:13px; letter-spacing:.13em; transition:transform .2s, background .2s; }\n    .action:active { transform:scale(.97); }\n    .action:hover { background:#ffda89; }\n    .thin-action { color:var(--ink); background:transparent; border-color:var(--line); }\n    .rail { position:absolute; z-index:4; inset:0; border-left:1px solid rgba(242,197,107,.18); border-right:1px solid rgba(242,197,107,.18); width:min(100%,620px); margin:auto; pointer-events:none; }\n    .route { position:absolute; left:50%; top:0; bottom:0; width:1px; background:linear-gradient(transparent,rgba(242,197,107,.6),transparent); opacity:.45; }\n\n    /* boarding */\n    #board { min-height:100svh; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 115%,#294851 0%,#0e1b22 36%,#071015 74%); }\n    .bus-lights { position:absolute; inset:auto 0 18vh; height:2px; background:linear-gradient(90deg,transparent 4%,#f2c56b 24%,transparent 25%,transparent 75%,#f2c56b 76%,transparent 96%); box-shadow:0 0 30px #f2c56b; opacity:.7; }\n    .ticket { position:relative; z-index:2; width:min(86vw,390px); padding:27px 26px 24px; color:#143038; background:#f3ead8; clip-path:polygon(0 0,100% 0,100% 14%,97% 17%,100% 20%,100% 80%,97% 83%,100% 86%,100% 100%,0 100%,0 86%,3% 83%,0 80%,0 20%,3% 17%,0 14%); box-shadow:0 28px 80px #0009; transform:rotate(-2deg); }\n    .ticket::after { content:\"\"; position:absolute; top:14px; bottom:14px; right:38%; border-left:1px dashed #607071; }\n    .ticket h1 { margin:0; font-size:clamp(52px,16vw,78px); line-height:1; }\n    .ticket p { margin:11px 0; font-size:12px; letter-spacing:.13em; }\n    .ticket input { width:100%; border:0; border-bottom:1px solid #456169; padding:12px 0 9px; outline:none; background:transparent; color:#15343b; font:20px/1.2 monospace; letter-spacing:.45em; }\n    .ticket .action { margin-top:18px; width:100%; }\n    .error { min-height:18px; color:#b43c2e; font-size:12px; margin:9px 0 0; }\n    #door { position:fixed; z-index:30; inset:0; pointer-events:none; display:none; transform:translateZ(0); }\n    #door.visible { display:flex; }\n    #door i { width:50%; background:#050b0e; border-color:#f2c56b55; transition:transform .9s cubic-bezier(.75,0,.2,1); }\n    #door i:first-child { border-right:1px solid #f2c56b55; }\n    #door i:last-child { border-left:1px solid #f2c56b55; }\n    #door.open i:first-child { transform:translateX(-100%); }\n    #door.open i:last-child { transform:translateX(100%); }\n\n    /* intro: two photos, one clear action */\n    #opening { display:grid; place-items:center; background:linear-gradient(155deg,#101e25,#162732 55%,#0a1318); }\n    .opening-wrap { width:min(92vw,570px); height:100svh; display:grid; align-content:center; gap:20px; padding:26px 24px; }\n    .opening-head { position:relative; z-index:3; }\n    .opening-head h2 { margin:0; font-size:clamp(38px,10vw,66px); line-height:1.15; }\n    .memory-card { position:relative; height:min(50svh,430px); overflow:hidden; border:1px solid var(--line); background:var(--photo); box-shadow:0 22px 70px #0008; transform-origin:center; }\n    .memory-card::before { content:\"\"; position:absolute; inset:0; background:linear-gradient(145deg,#fff3,transparent 30%),repeating-linear-gradient(135deg,transparent 0 42px,#fff1 43px 44px); }\n    .memory-card::after { content:\"\"; position:absolute; inset:18px; border:1px solid #fff5; }\n    .photo-label { position:absolute; z-index:2; left:20px; bottom:18px; font-size:clamp(34px,9vw,58px); letter-spacing:.12em; font-weight:700; }\n    .photo-note { position:absolute; z-index:2; right:20px; top:20px; text-align:right; font-size:12px; line-height:1.7; color:#fff; }\n    .memory-card.zoom-in { animation:fromDetail .75s cubic-bezier(.2,.8,.2,1); }\n    @keyframes fromDetail { from { transform:scale(1.8); filter:blur(14px); opacity:.2; } to { transform:scale(1); filter:blur(0); opacity:1; } }\n    .direction { min-height:40px; color:#f5d685; font-size:12px; letter-spacing:.13em; text-align:center; transition:opacity .25s; }\n    .direction b { display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; border:1px solid #f5d685; font-weight:400; }\n    .direction.pulse { animation:hintPulse 1.35s infinite; }\n    @keyframes hintPulse { 50% { transform:translateY(5px); opacity:.58; } }\n    .gate-trigger { display:none; }\n\n    /* full-window questions */\n    .gate { position:fixed; z-index:25; inset:0; display:none; place-items:center; padding:22px; background:rgba(3,10,13,.88); backdrop-filter:blur(11px); }\n    .gate.open { display:grid; animation:gateIn .45s both; }\n    @keyframes gateIn { from { opacity:0; clip-path:inset(45% 0); } to { opacity:1; clip-path:inset(0); } }\n    .gate-box { position:relative; width:min(100%,440px); border:1px solid rgba(242,197,107,.65); padding:30px 25px; text-align:center; background:#0b1a20; box-shadow:0 28px 90px #000; }\n    .gate-box h2 { margin:6px 0 10px; font-family:\"Songti SC\",serif; font-size:35px; }\n    .answers { display:grid; gap:9px; margin-top:20px; }\n    .answer { padding:13px; color:var(--ink); cursor:pointer; background:#122b32; border:1px solid #3a6064; text-align:left; transition:background .2s, transform .2s; }\n    .answer:hover { background:#1b3d45; transform:translateX(3px); }\n    .gate-feedback { min-height:26px; margin:15px 0 0; color:#f5d685; font-size:13px; }\n    .shards { display:flex; justify-content:center; gap:7px; margin:16px 0; }\n    .shard { display:grid; place-items:center; width:74px; height:42px; color:#15343a; background:#f3ead8; font-size:11px; animation:shard 1.8s ease-in-out infinite alternate; }\n    .shard:nth-child(2){animation-delay:.25s}.shard:nth-child(3){animation-delay:.5s}\n    @keyframes shard { to { transform:translateY(-5px) rotate(2deg); } }\n\n    /* sticky photo chapters */\n    .gallery { min-height:100svh; display:grid; place-items:center; isolation:isolate; background:radial-gradient(circle at 50% 55%,#1b3c44,transparent 42%),#081217; touch-action:pan-y; }\n    .gallery::after { content:\"\"; position:absolute; z-index:-1; inset:0; background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(242,197,107,.23) 50%,transparent calc(50% + 1px)); opacity:.35; }\n    .gallery-title { position:absolute; z-index:3; left:clamp(20px,8vw,90px); top:max(20px,env(safe-area-inset-top)); }\n    .gallery-title h2 { margin:3px 0 0; font:600 clamp(25px,7vw,48px)/1.15 \"Songti SC\",serif; }\n    .counter { position:absolute; z-index:4; right:clamp(20px,8vw,90px); top:max(25px,env(safe-area-inset-top)); color:var(--gold); font:12px monospace; letter-spacing:.18em; }\n    .stage { position:relative; width:min(100vw,720px); height:100svh; overflow:hidden; touch-action:none; }\n    .photo { --photo:#3d706e; position:absolute; inset:15svh max(12px,6vw) 19svh; overflow:hidden; background:var(--photo); box-shadow:0 22px 70px #0008; transform-origin:center; }\n    .photo::before { content:\"\"; position:absolute; inset:0; opacity:.72; background:radial-gradient(circle at 22% 20%,#fff5,transparent 18%),linear-gradient(135deg,transparent 45%,#0003),repeating-linear-gradient(122deg,transparent 0 35px,#fff1 36px 38px); }\n    .photo::after { content:\"\"; position:absolute; inset:17px; border:1px solid #fff5; }\n    .photo .number { position:absolute; z-index:2; left:22px; bottom:20px; font-size:clamp(52px,16vw,106px); line-height:1; font-weight:700; letter-spacing:.05em; color:#fff; }\n    .photo .replace { position:absolute; z-index:2; right:21px; bottom:21px; max-width:160px; text-align:right; color:#fff; font-size:12px; line-height:1.8; }\n    .photo.back { background:#f3ead8 !important; color:#17333a; animation:ticketFlip .62s both; }\n    .photo.back::before { opacity:1; background:repeating-linear-gradient(90deg,transparent 0 38px,#25495122 39px 40px),linear-gradient(#fff8,#e8d8ba); }\n    .photo.back::after { border-color:#32555a88; }\n    .photo.back .number { color:#27484c; font-size:18px; top:20px; bottom:auto; letter-spacing:.14em; }\n    .photo.back .replace { left:21px; right:21px; bottom:30px; max-width:none; color:#29464b; text-align:left; font:600 clamp(30px,8vw,52px)/1.25 \"Songti SC\",serif; }\n    .photo.back .photo-writing { display:none; }\n    .caption { position:absolute; z-index:4; left:clamp(20px,7vw,80px); right:clamp(20px,7vw,80px); bottom:8svh; display:flex; align-items:end; justify-content:space-between; gap:16px; pointer-events:none; }\n    .caption p { max-width:260px; margin:0; color:#e7e3db; font-size:13px; line-height:1.75; text-shadow:0 2px 10px #000; }\n    .gesture { flex:0 0 auto; pointer-events:auto; cursor:pointer; }\n    .gesture.hidden { opacity:0; }\n    .gesture b { font-size:20px; vertical-align:-1px; margin-right:4px; }\n    .photo.cover { animation:cover .65s cubic-bezier(.17,.76,.29,1) both; }\n    .photo.zoom { animation:photoZoom .72s cubic-bezier(.2,.8,.2,1) both; }\n    .photo.turn { animation:turn .7s cubic-bezier(.18,.8,.2,1) both; }\n    .photo.float { animation:float .72s cubic-bezier(.17,.9,.2,1) both; }\n    .photo.fade { animation:softFade .7s ease both; }\n    .photo.stack { animation:stack .7s cubic-bezier(.22,.8,.25,1) both; }\n    @keyframes cover { from { transform:translateY(105%) scale(.84); } to { transform:none; } }\n    @keyframes photoZoom { from { transform:scale(1.36); filter:blur(14px); opacity:0; } to { transform:none; filter:none; opacity:1; } }\n    @keyframes turn { from { transform:rotate(13deg) translateX(100%); opacity:0; } to { transform:none; opacity:1; } }\n    @keyframes float { from { transform:translateX(-110%) rotate(-9deg); opacity:0; } to { transform:none; opacity:1; } }\n    @keyframes softFade { from { opacity:0; } to { opacity:1; } }\n    @keyframes stack { from { transform:scale(.7) translateY(45%) rotate(-6deg); opacity:0; } to { transform:none; opacity:1; } }\n    .fog { position:absolute; z-index:3; inset:0; background:linear-gradient(105deg,#d9e4dbdd,#9db8bccc); transition:opacity .7s; }\n    .fog.clear { opacity:0; pointer-events:none; }\n    .tap-mark { position:absolute; z-index:5; right:8vw; top:18svh; width:44px; height:44px; border:1px solid #f2c56b; border-radius:50%; display:none; place-items:center; color:#f2c56b; animation:halo 1.2s infinite; }\n    .tap-mark.show { display:grid; }\n    @keyframes halo { 50% { box-shadow:0 0 0 11px transparent,0 0 0 1px #f2c56b; } }\n    .ticket-slip { position:absolute; z-index:4; right:8vw; top:20svh; display:none; width:120px; padding:11px; color:#19343a; background:#f3ead8; transform:rotate(8deg); font-size:11px; line-height:1.6; }\n    .ticket-slip.show { display:block; animation:ticketFlip .5s both; }\n    @keyframes ticketFlip { from { transform:rotateY(90deg) rotate(8deg); } to { transform:rotateY(0) rotate(8deg); } }\n    .arrival-lamp { position:absolute; z-index:7; top:16svh; right:10vw; display:none; width:26px; height:26px; border-radius:50%; background:#536466; cursor:pointer; }\n    .arrival-lamp.show { display:block; }\n    .arrival-lamp.lit { background:var(--gold); box-shadow:0 0 10px var(--gold),0 0 45px var(--gold); }\n\n    /* the separated 8-16 chapter */\n    #distance { background:radial-gradient(circle at 50% 40%,#2b293d,transparent 38%),#0b1018; }\n    .dual .photo { inset:17svh auto 20svh; width:min(72vw,470px); }\n    .dual .photo.main { left:50%; transform:translateX(-50%); }\n    .dual .photo.side { left:4vw; width:25vw; height:16svh; top:18svh; bottom:auto; opacity:.72; filter:saturate(.75); }\n    .dual .photo.side .number { font-size:20px; left:10px; bottom:9px; }\n    .dual .photo.side .replace { display:none; }\n    .dual.split .photo.main { width:43vw; }\n    .dual.split .photo.main.left { left:4vw; transform:none; }\n    .dual.split .photo.main.right { right:4vw; left:auto; transform:none; }\n    .dual.split .photo.main .number { font-size:clamp(36px,9vw,65px); }\n    .dual.ticket-mode .photo.main { clip-path:polygon(0 0,100% 0,100% 15%,97% 20%,100% 25%,100% 75%,97% 80%,100% 85%,100% 100%,0 100%,0 85%,3% 80%,0 75%,0 25%,3% 20%,0 15%); }\n    .bridge { position:absolute; z-index:5; top:50%; left:50%; width:0; height:1px; background:var(--gold); box-shadow:0 0 24px var(--gold); transition:width .9s,left .9s; }\n    .bridge.join { left:0; width:100%; }\n\n    /* final */\n    #ending { display:grid; place-items:center; min-height:100svh; padding:35px 20px; text-align:center; background:radial-gradient(circle at 50% 43%,#27353d,transparent 37%),#0b1115; }\n    .future-ticket { width:min(88vw,430px); color:#183239; background:#f3ead8; padding:28px 26px; text-align:left; box-shadow:0 22px 70px #0008; animation:arrive 1s cubic-bezier(.18,.88,.2,1) both; }\n    @keyframes arrive { from { transform:translateY(60px) scale(.85); opacity:0; } to { transform:none; opacity:1; } }\n    .future-ticket h2 { color:#193139; margin:3px 0 18px; font:600 clamp(37px,10vw,55px)/1.15 \"Songti SC\",serif; }\n    .future-ticket p { margin:0; padding:12px 0; border-top:1px dashed #7d8a86; color:#31484b; font-size:13px; }\n    .future-ticket b { color:#1f3435; }\n    .restart { margin-top:22px; color:var(--muted); background:none; border:0; cursor:pointer; font-size:12px; }\n    @media (max-width:520px) {\n      .ticket { width:calc(100vw - 34px); padding:24px 22px 21px; }\n      .ticket h1 { font-size:58px; }\n      .opening-wrap { padding:22px 17px; gap:15px; }\n      .opening-head h2 { font-size:38px; }\n      .memory-card { height:45svh; }\n      .gallery-title { left:18px; top:20px; }\n      .gallery-title h2 { font-size:31px; }\n      .counter { right:18px; top:26px; }\n      .photo { inset:14svh 13px 20svh; }\n      .photo .number { left:17px; bottom:17px; font-size:55px; }\n      .photo .replace { right:17px; bottom:17px; max-width:126px; font-size:11px; }\n      .caption { left:18px; right:18px; bottom:4svh; align-items:end; }\n      .caption p { max-width:210px; font-size:12px; }\n      .direction { font-size:11px; white-space:nowrap; }\n      .gesture.pulse { animation:none; }\n      .dual .photo { width:78vw; }\n      .dual .photo.side { width:22vw; height:13svh; }\n      .gate-box { padding:27px 19px; }\n      .answer { min-height:48px; }\n    }\n    @media (min-width:760px) { .photo { inset-left:12vw; inset-right:12vw; } .opening-wrap { grid-template-columns:1fr 1.1fr; align-items:center; } .opening-head { order:2; } .memory-card { height:62svh; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"grain\">\u003c/div>\n  \u003cdiv id=\"door\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n\n  \u003cmain>\n    \u003csection id=\"board\" class=\"chapter\">\n      \u003cdiv class=\"stars\">\u003c/div>\u003cdiv class=\"bus-lights\">\u003c/div>\n      \u003cform id=\"boarding\" class=\"ticket\">\n        \u003cp>MEMORY BUS / 489978\u003c/p>\n        \u003ch1 class=\"display\">宝宝巴士\u003c/h1>\n        \u003cp>请输入车票密码，今晚的车门只为这一段记忆打开。\u003c/p>\n        \u003cinput id=\"code\" aria-label=\"车票密码\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"489978\">\n        \u003cbutton class=\"action\" type=\"submit\">验票上车\u003c/button>\n        \u003cp id=\"codeError\" class=\"error\">\u003c/p>\n      \u003c/form>\n    \u003c/section>\n\n    \u003csection id=\"opening\" class=\"chapter\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\u003cdiv class=\"rail\">\u003c/div>\n      \u003cdiv class=\"opening-wrap\">\n        \u003cdiv class=\"opening-head\">\n          \u003cp class=\"eyebrow\">STORY BEGINS\u003c/p>\n          \u003ch2 class=\"display\">车门打开以后，\u003cbr>先是那一天。\u003c/h2>\n          \u003cp class=\"copy\" id=\"openCopy\">这里可以写下第一次见面时，最想留下的一句话。\u003c/p>\n        \u003c/div>\n        \u003cdiv id=\"openingCard\" class=\"memory-card zoom-in\" style=\"--photo:linear-gradient(135deg,#b25c5d,#5b2941)\">\n          \u003cspan class=\"photo-label\">开场 A\u003c/span>\n          \u003cspan class=\"photo-note\">照片放置处\u003cbr>第一次见面的画面\u003c/span>\n        \u003c/div>\n        \u003cp id=\"openingHint\" class=\"direction pulse\">\u003cb>←\u003c/b>轻划，翻到故事的另一面\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"travel\" class=\"chapter gallery\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\n      \u003cdiv class=\"gallery-title\">\u003cp class=\"eyebrow\">THE SAME SIDE OF THE WORLD\u003c/p>\u003ch2>天地一方\u003c/h2>\u003c/div>\n      \u003cdiv id=\"travelCounter\" class=\"counter\">01 / 07\u003c/div>\n      \u003cdiv id=\"travelStage\" class=\"stage\">\n        \u003cdiv id=\"travelPhoto\" class=\"photo\">\u003cspan class=\"number\">图片 01\u003c/span>\u003cspan class=\"replace\">把这一站的照片和一句话\u003cbr>放进这里\u003c/span>\u003c/div>\n        \u003cdiv id=\"fog\" class=\"fog\">\u003c/div>\n        \u003cdiv id=\"tapMark\" class=\"tap-mark\">点\u003c/div>\n        \u003cdiv id=\"ticketSlip\" class=\"ticket-slip\">票根背面\u003cbr>[ 写下当时的一句话 ]\u003c/div>\n        \u003cdiv id=\"arrivalLamp\" class=\"arrival-lamp\" aria-label=\"点亮到站灯\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"caption\">\u003cp id=\"travelCaption\">雾还没有散开。先轻划，把这一站的画面从雾里带出来。\u003c/p>\u003cdiv id=\"travelHint\" class=\"direction gesture\">\u003cb>←\u003c/b>轻划翻开\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"distance\" class=\"chapter gallery\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\n      \u003cdiv class=\"gallery-title\">\u003cp class=\"eyebrow\">TWO PLACES, ONE DIRECTION\u003c/p>\u003ch2>天各一方\u003c/h2>\u003c/div>\n      \u003cdiv id=\"distanceCounter\" class=\"counter\">08 / 16\u003c/div>\n      \u003cdiv id=\"distanceStage\" class=\"stage dual\">\n        \u003cdiv id=\"distanceMain\" class=\"photo main\">\u003cspan class=\"number\">图片 08\u003c/span>\u003cspan class=\"replace\">这一站的照片\u003cbr>和一句想说的话\u003c/span>\u003c/div>\n        \u003cdiv id=\"distanceSide\" class=\"photo side\" hidden>\u003cspan class=\"number\">图片 08\u003c/span>\u003c/div>\n        \u003cdiv id=\"bridge\" class=\"bridge\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"caption\">\u003cp id=\"distanceCaption\">下一段故事，在另一座城市慢慢展开。\u003c/p>\u003cdiv id=\"distanceHint\" class=\"direction gesture\">\u003cb>←\u003c/b>轻划进入下一段\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"ending\" class=\"chapter\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\n      \u003cdiv>\n        \u003cp class=\"eyebrow\">NEXT STOP\u003c/p>\n        \u003cdiv class=\"future-ticket\">\n          \u003cp>有效期：一直\u003c/p>\n          \u003ch2 id=\"futureHeading\">下一站：幸福\u003c/h2>\n          \u003cp id=\"futureMessage\">[ 写给未来的一句话 ]\u003c/p>\n          \u003cp>\u003cb>目的地\u003c/b>　[ 想一起去的地方 ]\u003c/p>\n          \u003cp>\u003cb>下一件事\u003c/b>　[ 一个小约定 ]\u003c/p>\n          \u003cp>\u003cb>再次打开\u003c/b>　[ 一个值得纪念的日期 ]\u003c/p>\n        \u003c/div>\n        \u003cbutton id=\"restart\" class=\"restart\">回到发车前\u003c/button>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"gateOne\" class=\"gate\" role=\"dialog\" aria-modal=\"true\">\n    \u003cdiv class=\"gate-box\">\n      \u003cp class=\"eyebrow\">FIRST CHECK\u003c/p>\u003ch2>第一站验证\u003c/h2>\n      \u003cp class=\"copy\">那天以后，这段旅程真正开始的原因是什么？\u003c/p>\n      \u003cdiv class=\"answers\">\u003cbutton class=\"answer\" data-gate=\"one\" data-answer=\"wrong\">A. 因为刚好顺路\u003c/button>\u003cbutton class=\"answer\" data-gate=\"one\" data-answer=\"right\">B. 因为想和你一直走下去\u003c/button>\u003c/div>\n      \u003cp id=\"gateOneFeedback\" class=\"gate-feedback\">\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"gateTwo\" class=\"gate\" role=\"dialog\" aria-modal=\"true\">\n    \u003cdiv class=\"gate-box\">\n      \u003cp class=\"eyebrow\">SECOND CHECK\u003c/p>\u003ch2>第二站验证\u003c/h2>\n      \u003cdiv class=\"shards\">\u003cspan class=\"shard\">01\u003c/span>\u003cspan class=\"shard\">04\u003c/span>\u003cspan class=\"shard\">07\u003c/span>\u003c/div>\n      \u003cp class=\"copy\">这些碎片拼成的，不是一张旧车票，而是继续向前的理由。\u003c/p>\n      \u003cdiv class=\"answers\">\u003cbutton class=\"answer\" data-gate=\"two\" data-answer=\"wrong\">A. 到这里就够了\u003c/button>\u003cbutton class=\"answer\" data-gate=\"two\" data-answer=\"right\">B. 下一段也要一起走\u003c/button>\u003c/div>\n      \u003cp id=\"gateTwoFeedback\" class=\"gate-feedback\">\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    (() => {\n      const $ = (id) => document.getElementById(id);\n      const memory = (() => {\n        try {\n          if (window.MEMORY_DATA) return window.MEMORY_DATA;\n          if (new URLSearchParams(location.search).has('preview')) return JSON.parse(localStorage.getItem('baby-bus-memory-data') || '{}');\n          return {};\n        }\n        catch { return {}; }\n      })();\n      const palette = {\n        A:'linear-gradient(135deg,#b25c5d,#5b2941)', B:'linear-gradient(135deg,#e89b63,#a44945)',\n        1:'linear-gradient(135deg,#547d87,#162c3b)', 2:'linear-gradient(135deg,#d77d5c,#70403f)',\n        3:'linear-gradient(135deg,#86714b,#354334)', 4:'linear-gradient(135deg,#a4617d,#3e2846)',\n        5:'linear-gradient(135deg,#5d938c,#23414c)', 6:'linear-gradient(135deg,#bc9a50,#5b4630)',\n        7:'linear-gradient(135deg,#5c709d,#25294d)', 8:'linear-gradient(135deg,#7e748d,#302b45)',\n        9:'linear-gradient(135deg,#bd745f,#5a3345)', 10:'linear-gradient(135deg,#517c75,#253f43)',\n        11:'linear-gradient(135deg,#ae8d52,#504023)', 12:'linear-gradient(135deg,#6a789c,#303a58)',\n        13:'linear-gradient(135deg,#b66673,#522e3c)', 14:'linear-gradient(135deg,#455a75,#1c2639)',\n        15:'linear-gradient(135deg,#c99761,#60452f)', 16:'linear-gradient(135deg,#607d75,#2d4742)'\n      };\n      const travel = [\n        ['cover','雾还没有散开。先轻划，把这一站的画面从雾里带出来。','←','轻划翻开'],\n        ['zoom','有些瞬间靠近看，才发现它比记忆里还亮。','←','轻划靠近'],\n        ['turn','翻过这一张，是一段可以写进照片旁边的小事。','←','轻划翻面'],\n        ['float','这一站需要点按照片，翻开背面的票根。','点','点按照片'],\n        ['stack','同一段日子，被悄悄收进了不同的画面里。','←','轻划收好'],\n        ['fade','把这一页留给一句不必解释的话。','←','轻划继续'],\n        ['cover','最后一张到站了。点亮右上角的灯，下一扇门才会打开。','点','点亮到站灯']\n      ];\n      const distance = [\n        ['main','','下一段故事，在另一座城市慢慢展开。','←','轻划进入下一段'],\n        ['main','8','同一段回忆被留在边上，新的画面来到正中。','←','轻划继续'],\n        ['main','9','不需要把过去藏起来，只要继续往前。','←','轻划继续'],\n        ['main','10','隔着屏幕，也能把今天讲给对方听。','←','轻划继续'],\n        ['main','11','每一张照片都可以放一段自己的文字。','←','轻划继续'],\n        ['main','12','距离没有让故事停在这里。','←','轻划继续'],\n        ['split','','两个方向，同时亮起。','←','轻划抵达'],\n        ['ticket','','这一页是一张准备出发的车票。','←','轻划汇合'],\n        ['merge','','这一段已经走完。向下，让两边的画面汇合。','↓','向下汇合']\n      ];\n      const state = { opening:0, t:1, d:8, x:0, y:0, lastX:0, lastY:0, cool:false, travelBack:false, lockedId:null };\n      const lockTo = (id) => {\n        state.lockedId = id;\n        const section = $(id);\n        window.scrollTo(0, section.offsetTop);\n      };\n      const show = (id) => { $(id).hidden = false; requestAnimationFrame(() => lockTo(id)); };\n      const setDirection = (target, symbol, words) => { target.innerHTML = `\u003cb>${symbol}\u003c/b>${words}`; target.classList.add('pulse'); };\n      const enter = () => {\n        const door = $('door');\n        door.classList.add('visible');\n        requestAnimationFrame(() => requestAnimationFrame(() => door.classList.add('open')));\n        setTimeout(() => { door.classList.remove('visible'); show('opening'); }, 900);\n      };\n      $('boarding').addEventListener('submit', (event) => {\n        event.preventDefault();\n        if ($('code').value.trim() !== '489978') { $('codeError').textContent = '车票密码不对，再想一想。'; return; }\n        $('codeError').textContent = '';\n        enter();\n      });\n\n      const memoryText = (number, fallback) => memory.text?.[String(number)]?.trim() || fallback;\n      const memoryImage = (number) => memory.images?.[String(number)] || '';\n      const personalizeStaticCopy = () => {\n        $('openCopy').textContent = memoryText('openingWords', '这里可以写下第一次见面时，最想留下的一句话。');\n        $('futureHeading').textContent = memoryText('endingTitle', '下一站：幸福');\n        $('futureMessage').textContent = memoryText('endingWords', '[ 写给未来的一句话 ]');\n      };\n      function applyPhotoBackground(photo, number) {\n        const image = memoryImage(number);\n        photo.style.setProperty('--photo', image ? `linear-gradient(145deg,rgba(0,0,0,.08),rgba(0,0,0,.38)),url(\"${image}\") center/cover` : palette[number]);\n      }\n      function paint(photo, number, effect, text, side=false) {\n        photo.className = `photo ${side ? 'side' : 'main'} ${effect || ''}`;\n        applyPhotoBackground(photo, number);\n        photo.innerHTML = `\u003cspan class=\"number\">图片 ${String(number).padStart(2,'0')}\u003c/span>${side ? '' : `\u003cspan class=\"replace\">${memoryText(number, text)}\u003c/span>`}`;\n      }\n      function renderOpening() {\n        const isB = state.opening === 1;\n        const card = $('openingCard');\n        card.classList.remove('zoom-in'); void card.offsetWidth; card.classList.add('zoom-in');\n        applyPhotoBackground(card, isB ? 'B' : 'A');\n        card.innerHTML = `\u003cspan class=\"photo-label\">开场 ${isB ? 'B' : 'A'}\u003c/span>\u003cspan class=\"photo-note\">照片放置处\u003cbr>${isB ? '那天之后的另一个片段' : '第一次见面的画面'}\u003c/span>`;\n        $('openCopy').textContent = isB ? '第二张照片后，向下进入这一段记忆的第一道门。' : memoryText('openingWords', '这里可以写下第一次见面时，最想留下的一句话。');\n        setDirection($('openingHint'), isB ? '↓' : '←', isB ? '向下进入第一站验证 · 点按也可进入' : '轻划翻面 · 点按也可继续');\n      }\n      function openGate(id) { $(id).classList.add('open'); }\n      function renderTravel() {\n        const item = travel[state.t - 1];\n        state.travelBack=false;\n        paint($('travelPhoto'), state.t, item[0], '这里放入照片和这一站的文字');\n        $('travelCounter').textContent = `${String(state.t).padStart(2,'0')} / 07`;\n        $('travelCaption').textContent = item[1];\n        setDirection($('travelHint'), item[2], state.t === 7 ? item[3] : `${item[3]} · 点按也可继续`);\n        $('fog').classList.toggle('clear', state.t !== 1);\n        $('tapMark').classList.toggle('show', state.t === 4);\n        $('ticketSlip').classList.remove('show');\n        $('arrivalLamp').classList.toggle('show', state.t === 7);\n      }\n      function renderDistance() {\n        const frame = distance[state.d - 8];\n        const stage = $('distanceStage');\n        stage.className = `stage dual ${frame[0] === 'split' ? 'split' : ''} ${frame[0] === 'ticket' ? 'ticket-mode' : ''}`;\n        paint($('distanceMain'), state.d, ['cover','float','zoom','turn','stack','fade','cover','turn','zoom'][state.d - 8], '这里放照片和一段文字');\n        if (frame[1]) { $('distanceSide').hidden=false; paint($('distanceSide'), frame[1], '', '', true); } else { $('distanceSide').hidden=true; }\n        if (frame[0] === 'split') {\n          paint($('distanceMain'), 14, 'cover', '左边和右边，各自有一张照片');\n          $('distanceMain').classList.add('left');\n          $('distanceSide').hidden=false; paint($('distanceSide'), 14, 'float', '', true); $('distanceSide').classList.remove('side'); $('distanceSide').classList.add('main','right');\n        }\n        if (frame[0] === 'merge') { $('distanceMain').style.transform='translateX(-50%) scale(.9)'; }\n        else { $('distanceMain').style.transform=''; }\n        $('distanceCounter').textContent = `${String(state.d).padStart(2,'0')} / 16`;\n        $('distanceCaption').textContent = frame[2];\n        setDirection($('distanceHint'), frame[3], state.d === 16 ? frame[4] : `${frame[4]} · 点按也可继续`);\n      }\n      function moveInChapter(chapter, endX, endY) {\n        if (state.cool) return;\n        const dx = endX - state.x, dy = endY - state.y;\n        if (Math.max(Math.abs(dx), Math.abs(dy)) \u003c 38) return;\n        state.cool=true; setTimeout(() => state.cool=false, 360);\n        if (chapter === 'travel' && Math.abs(dx) > Math.abs(dy)) {\n          if (dx \u003c 0 && state.t \u003c 7) { state.t++; renderTravel(); }\n          if (dx > 0 && state.t > 1) { state.t--; renderTravel(); }\n          return;\n        }\n        if (chapter === 'distance' && Math.abs(dx) > Math.abs(dy)) {\n          if (dx \u003c 0 && state.d \u003c 16) { state.d++; renderDistance(); }\n          if (dx > 0 && state.d > 8) { state.d--; renderDistance(); }\n          return;\n        }\n        if (chapter === 'opening' && state.opening === 1 && dy \u003c -38) openGate('gateOne');\n        if (chapter === 'distance' && state.d === 16 && dy \u003c -38) { $('bridge').classList.add('join'); setTimeout(() => show('ending'), 850); }\n      }\n      function bindGestures(element, chapter) {\n        element.addEventListener('pointerdown', (event) => { state.x=event.clientX; state.y=event.clientY; state.lastX=event.clientX; state.lastY=event.clientY; });\n        element.addEventListener('pointermove', (event) => { state.lastX=event.clientX; state.lastY=event.clientY; });\n        element.addEventListener('pointerup', (event) => moveInChapter(chapter, event.clientX || state.lastX, event.clientY || state.lastY));\n        element.addEventListener('touchstart', (event) => {\n          const touch = event.changedTouches[0];\n          state.x = touch.clientX;\n          state.y = touch.clientY;\n          state.lastX = touch.clientX;\n          state.lastY = touch.clientY;\n        }, { passive:true });\n        element.addEventListener('touchmove', (event) => {\n          const touch = event.changedTouches[0];\n          state.lastX = touch.clientX;\n          state.lastY = touch.clientY;\n        }, { passive:true });\n        element.addEventListener('touchend', (event) => {\n          const touch = event.changedTouches[0];\n          moveInChapter(chapter, touch ? touch.clientX : state.lastX, touch ? touch.clientY : state.lastY);\n        }, { passive:false });\n      }\n      bindGestures($('opening'), 'opening');\n      bindGestures($('travelStage'), 'travel');\n      bindGestures($('distanceStage'), 'distance');\n      window.addEventListener('scroll', () => {\n        if (!state.lockedId) return;\n        const locked = $(state.lockedId);\n        if (!locked || locked.hidden) return;\n        if (Math.abs(window.scrollY - locked.offsetTop) > 2) window.scrollTo(0, locked.offsetTop);\n      }, { passive:true });\n      $('openingCard').addEventListener('click', () => { if (state.opening === 0) { state.opening=1; renderOpening(); } });\n      $('openingHint').addEventListener('click', () => {\n        if (state.opening === 0) { state.opening=1; renderOpening(); }\n        else openGate('gateOne');\n      });\n      $('opening').addEventListener('wheel', (e) => { e.preventDefault(); if (state.opening === 1 && e.deltaY > 24) openGate('gateOne'); }, {passive:false});\n      $('travel').addEventListener('wheel', (e) => e.preventDefault(), {passive:false});\n      $('distance').addEventListener('wheel', (e) => e.preventDefault(), {passive:false});\n      $('fog').addEventListener('click', () => { $('fog').classList.add('clear'); $('travelCaption').textContent='雾散开了。现在可以向左翻到下一张。'; });\n      $('travelPhoto').addEventListener('click', (event) => {\n        if (event.target.closest('[contenteditable]') || state.t !== 4) return;\n        const photo = $('travelPhoto');\n        state.travelBack = !state.travelBack;\n        photo.classList.toggle('back', state.travelBack);\n        $('tapMark').classList.toggle('show', !state.travelBack);\n        if (state.travelBack) {\n          photo.innerHTML = `\u003cspan class=\"number\">票根背面 / 图片 04\u003c/span>\u003cspan class=\"replace\">${memoryText(4, '这里写下那天最想留下的一句话')}\u003c/span>`;\n          $('travelCaption').textContent='照片翻到背面了。这里就是可以填写文字的位置，再点一次翻回照片。';\n          setDirection($('travelHint'), '点', '点按翻回照片');\n        } else {\n          renderTravel();\n        }\n      });\n      $('arrivalLamp').addEventListener('click', () => { if (state.t === 7) { $('arrivalLamp').classList.add('lit'); $('travelHint').classList.remove('pulse'); setTimeout(() => openGate('gateTwo'), 560); } });\n      $('travelHint').addEventListener('click', () => {\n        if (state.t \u003c 7) { state.t++; renderTravel(); }\n      });\n      $('distanceHint').addEventListener('click', () => {\n        if (state.d \u003c 16) { state.d++; renderDistance(); return; }\n        $('bridge').classList.add('join');\n        setTimeout(() => show('ending'), 850);\n      });\n      document.querySelectorAll('.answer').forEach((button) => button.addEventListener('click', () => {\n        const right = button.dataset.answer === 'right';\n        const one = button.dataset.gate === 'one';\n        const feedback = $(one ? 'gateOneFeedback' : 'gateTwoFeedback');\n        if (!right) { feedback.textContent='还差一点。再看看这段旅程真正想留下的答案。'; return; }\n        feedback.textContent='答对了。这扇门为你打开。';\n        setTimeout(() => {\n          $(one ? 'gateOne' : 'gateTwo').classList.remove('open');\n          if (one) { show('travel'); renderTravel(); } else { show('distance'); renderDistance(); }\n        }, 620);\n      }));\n      $('restart').addEventListener('click', () => location.reload());\n      personalizeStaticCopy();\n      renderOpening();\n    })();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
