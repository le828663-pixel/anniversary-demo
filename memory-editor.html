  <style>
    :root{--ink:#eff0e8;--muted:#a3aaa7;--bg:#0a1217;--panel:#101d22;--line:#31454a;--gold:#eec46e;--red:#db785f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.shell{max-width:1100px;margin:auto;padding:26px 22px 70px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{margin:0 0 9px;color:var(--gold);font:11px monospace;letter-spacing:.2em}.top h1{margin:0;font:600 clamp(31px,5vw,54px)/1.1 "Songti SC",serif}.top p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 15px;cursor:pointer;font-size:12px;letter-spacing:.08em}.btn.primary{background:var(--gold);color:#173037;border-color:var(--gold)}.mobile-section{display:none}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;margin-top:28px}.steps{position:sticky;top:18px;height:max-content;border-left:1px solid var(--line)}.step{display:block;width:100%;padding:12px 14px;border:0;border-left:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-size:13px}.step.active{border-left-color:var(--gold);color:var(--ink);background:#18272c}.work h2{margin:0 0 8px;font:600 28px "Songti SC",serif}.work>p{margin:0 0 20px;color:var(--muted);font-size:13px}.slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.slot{border:1px solid var(--line);background:var(--panel);padding:14px;min-height:205px}.slot.current{border-color:var(--gold);box-shadow:inset 0 0 0 1px #eec46e33}.slot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.slot-head b{font-size:13px}.slot-head span{color:var(--gold);font:11px monospace}.image-box{height:95px;position:relative;display:grid;place-items:center;overflow:hidden;background:#182b31;border:1px dashed #567076;background-size:cover;background-position:center}.image-box.has{border-style:solid}.image-box button{border:0;background:#eec46e;color:#19343a;padding:8px 10px;font-size:12px;pointer-events:none}.image-box input{position:absolute;z-index:3;inset:0;opacity:0;cursor:pointer}.image-box em{font-style:normal;color:#b9c5c2;font-size:12px;pointer-events:none}.slot textarea,.slot select,.slot input[data-text]{width:100%;height:62px;resize:vertical;margin-top:10px;padding:9px;border:1px solid #3a5358;background:#0b1418;color:var(--ink);font:12px/1.6 inherit}.slot select{resize:none;cursor:pointer}.slot input[data-text]{resize:none;letter-spacing:.2em}.bottom-tip{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px;line-height:1.8}.status{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,30px);opacity:0;background:#eec46e;color:#183339;padding:10px 15px;font-size:12px;transition:.25s}.status.show{transform:translate(-50%,0);opacity:1}.editor-gate{min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 105%,#213d42 0%,#0a1217 56%)}.editor-gate-box{width:min(100%,390px);padding:30px 27px;border:1px solid #53676a;background:#101d22;box-shadow:0 28px 80px #0009}.editor-gate-box h1{margin:0;font:600 42px/1.1 "Songti SC",serif}.editor-gate-box p{margin:11px 0 22px;color:var(--muted);font-size:13px;line-height:1.75}.editor-gate-box input{width:100%;padding:13px;border:1px solid var(--line);outline:0;background:#0b1418;color:var(--ink);font:22px/1 monospace;letter-spacing:.35em}.editor-gate-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #eec46e22}.editor-gate-box button{width:100%;margin-top:13px}.gate-error{min-height:20px;margin:10px 0 0;color:var(--red);font-size:12px}@media(max-width:700px){.shell{padding:20px 14px 56px}.top{display:block}.actions{margin-top:18px}.mobile-section{display:block;width:100%;margin-top:18px;padding:13px;border:1px solid var(--gold);border-radius:0;background:#15262c;color:var(--ink);font:15px inherit}.layout{display:block}.steps{display:none}.slot-grid{grid-template-columns:1fr}.slot{min-height:190px}.image-box{height:auto;min-height:115px;padding:12px;align-content:end}.image-box input{position:static;z-index:auto;opacity:1;width:100%;color:var(--ink);font-size:13px}.image-box button{display:none}.image-box em{position:absolute;top:14px;left:0;right:0;text-align:center}.image-box.has input{background:#0d171b99;padding:7px}.slot textarea,.slot select,.slot input[data-text]{font-size:16px}.editor-gate-box{padding:28px 22px}.editor-gate-box h1{font-size:38px}}
  </style>

<body>
  <section id="editorGate" class="editor-gate"><form class="editor-gate-box"><p class="eyebrow">EDITOR ACCESS</p><h1>编辑台</h1><p>输入访问密码后，才能修改照片、文字和网页入口密码。</p><input id="editorAccessCode" type="password" inputmode="numeric" autocomplete="current-password" maxlength="5" aria-label="编辑台访问密码" autofocus><button class="btn primary" type="submit">进入编辑台</button><p id="editorGateError" class="gate-error" aria-live="polite"></p></form></section>
  <main id="editorApp" class="shell" hidden>
    <header class="top"><div><p class="eyebrow">MEMORY CONTENT EDITOR</p><h1>把照片和话，放回它们该在的位置。</h1><p>这里编辑，纪念网页本身不会出现输入框。</p></div><div class="actions"><button id="preview" class="btn">预览观看页</button><button id="export" class="btn primary">导出可分享网页</button></div></header>
    <select id="mobileSection" class="mobile-section" aria-label="选择编辑部分"></select><div class="layout"><nav id="steps" class="steps"></nav><section class="work"><h2 id="sectionTitle"></h2><p id="sectionCopy"></p><div id="slotGrid" class="slot-grid"></div><p class="bottom-tip">照片和文字只保存在当前浏览器，点击“导出可分享网页”后会得到一个独立 HTML 文件。把它发给别人即可，里面的照片和文字不会再显示编辑输入框。</p></section></div>
  </main><div id="status" class="status"></div>
  <script>
    const sections=[
      {id:'boarding',name:'上车设置',copy:'设置这份网页打开时需要输入的车票密码，只支持 4 到 12 位数字。',fields:[['boardingCode','车票密码','489978','code']],slots:[]},
      {id:'opening',name:'故事的开始',copy:'先写一句开场语，再放两张把人带进夜班车的照片。',fields:[['openingWords','开场语','例如：那晚以后，我们有了一趟只属于彼此的车。']],slots:[['A','开场 A'],['B','开场 B']]},
      {id:'firstCheck',name:'第一站验证',copy:'填写第一道四选一问题；正确选项决定答对后是否能进入天地一方。',fields:[['firstQuestion','问题','例如：那天以后，这段旅程真正开始的原因是什么？'],['firstOption1','选项 A','例如：因为刚好顺路'],['firstOption2','选项 B','例如：因为想和你一直走下去'],['firstOption3','选项 C','例如：因为这一晚没有别的安排'],['firstOption4','选项 D','例如：因为车刚好经过这里'],['firstCorrect','正确选项','2','choice']],slots:[]},
      {id:'together',name:'天地一方',copy:'七张照片，写下同一段时光里的七个片段。',slots:[[1,'图片 01'],[2,'图片 02'],[3,'图片 03'],[4,'图片 04 / 可翻票根'],[5,'图片 05'],[6,'图片 06'],[7,'图片 07']]},
      {id:'puzzle',name:'到站拼图',copy:'单独上传一张拼图照片。它只会在到站灯亮起后的碎裂过场和拼图里出现。',slots:[['puzzle','拼图专用照片']]},
      {id:'apart',name:'天各一方',copy:'九张照片，从另一座城市一路走到汇合。',slots:[[8,'图片 08'],[9,'图片 09'],[10,'图片 10'],[11,'图片 11'],[12,'图片 12'],[13,'图片 13'],[14,'图片 14 / 双图汇合'],[15,'图片 15 / 车票'],[16,'图片 16 / 汇合']]},
      {id:'secondCheck',name:'第二站验证',copy:'拼图会使用图片 07；拼好后出现第二道四选一问题。',fields:[['secondQuestion','问题','例如：拼回这段记忆以后，下一段路要怎么走？'],['secondOption1','选项 A','例如：到这里就够了'],['secondOption2','选项 B','例如：下一段也要一起走'],['secondOption3','选项 C','例如：等以后再说'],['secondOption4','选项 D','例如：各自换一条路线'],['secondCorrect','正确选项','2','choice']],slots:[]},
      {id:'ending',name:'下一站',copy:'填写结束标题、结束语，以及目的地、下一件事和再次打开的内容。',fields:[['endingTitle','结束标题','例如：下一站：幸福'],['endingWords','结束语','例如：愿我们把以后的每一站，都坐成同一趟车。'],['destinationText','目的地','例如：海边的那家小店'],['nextThingText','下一件事','例如：一起去看日出'],['reopenText','再次打开','例如：2027 年 8 月 8 日']],slots:[]}
    ];
    const $=id=>document.getElementById(id);const editorAccessKey='13579',editorSessionKey='baby-bus-editor-access';let data={images:{},text:{}};let active='opening';
    try{data=Object.assign(data,JSON.parse(localStorage.getItem('baby-bus-memory-data')||'{}'));data.images||={};data.text||={}}catch{}
    localStorage.removeItem('baby-bus-memory-preview');
    const save=()=>{try{localStorage.setItem('baby-bus-memory-data',JSON.stringify(data));return true}catch{toast('照片太多或太大，已阻止这次保存。请换一张更小的照片后再试。');return false}};
    const toast=message=>{$('status').textContent=message;$('status').classList.add('show');setTimeout(()=>$('status').classList.remove('show'),1700)};
      function render(){
        $('steps').innerHTML=sections.map(s=>`<button class="step ${s.id===active?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');
        $('mobileSection').innerHTML=sections.map(s=>`<option value="${s.id}" ${s.id===active?'selected':''}>${s.name}</option>`).join('');
      const section=sections.find(s=>s.id===active);$('sectionTitle').textContent=section.name;$('sectionCopy').textContent=section.copy;
      const textFields=(section.fields||[]).map(([key,label,placeholder,type])=>type==='choice'?`<article class="slot"><div class="slot-head"><b>${label}</b><span>选择</span></div><select data-text="${key}"><option value="1" ${(data.text[key]||placeholder)==='1'?'selected':''}>选项 A</option><option value="2" ${(data.text[key]||placeholder)==='2'?'selected':''}>选项 B</option><option value="3" ${(data.text[key]||placeholder)==='3'?'selected':''}>选项 C</option><option value="4" ${(data.text[key]||placeholder)==='4'?'selected':''}>选项 D</option></select></article>`:type==='code'?`<article class="slot"><div class="slot-head"><b>${label}</b><span>4-12 位数字</span></div><input data-text="${key}" inputmode="numeric" maxlength="12" pattern="[0-9]{4,12}" placeholder="${placeholder}" value="${data.text[key]||placeholder}"></article>`:`<article class="slot"><div class="slot-head"><b>${label}</b><span>文字</span></div><textarea data-text="${key}" placeholder="${placeholder}">${data.text[key]||''}</textarea></article>`).join('');
      const photoFields=section.slots.map(([id,label])=>{const key=String(id),image=data.images[key]||'',text=data.text[key]||'';return `<article class="slot"><div class="slot-head"><b>${label}</b><span>${image?'已放照片':'待放照片'}</span></div><label class="image-box ${image?'has':''}" style="${image?`background-image:url('${image}')`:''}"><input type="file" accept="image/*" data-image="${key}"><button type="button">${image?'更换照片':'选择照片'}</button>${image?'':'<em>照片将显示在这里</em>'}</label><textarea data-text="${key}" placeholder="填写这张照片想说的话">${text}</textarea></article>`}).join('');
      $('slotGrid').innerHTML=textFields+photoFields;
      $('slotGrid').querySelectorAll('input[data-image]').forEach(input=>{const writing=input.closest('.slot')?.querySelector('textarea[data-text]');if(!writing)return;writing.maxLength=32;writing.placeholder='最多 32 字，观看页会居中显示为最多两行';});
    }
    $('steps').addEventListener('click',e=>{const btn=e.target.closest('[data-id]');if(!btn)return;active=btn.dataset.id;render()});
    $('mobileSection').addEventListener('change',e=>{active=e.target.value;render()});
    $('slotGrid').addEventListener('input',e=>{if(!e.target.matches('textarea,input[data-text]'))return;data.text[e.target.dataset.text]=e.target.value;save()});
    $('slotGrid').addEventListener('change',e=>{const input=e.target;if(input.matches('select[data-text]')){data.text[input.dataset.text]=input.value;save();return}if(!input.matches('input[type=file]')||!input.files[0])return;const reader=new FileReader;reader.onload=()=>{data.images[input.dataset.image]=reader.result;save();render();toast('照片已放入这一站')};reader.readAsDataURL(input.files[0])});
    const compressImage=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(1,1000/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};image.src=reader.result};reader.readAsDataURL(file)});
    $('slotGrid').addEventListener('change',async e=>{const input=e.target;if(!input.matches('input[type=file]')||!input.files[0])return;e.stopImmediatePropagation();const key=input.dataset.image,previous=data.images[key];try{data.images[key]=await compressImage(input.files[0]);if(!save()){if(previous)data.images[key]=previous;else delete data.images[key];render();return}render();toast('照片已压缩保存，预览和导出都会使用这张图。')}catch{toast('这张照片无法读取，请换一张后再试。')}},true);
    const buildIndependentPage=()=>{save();const injection=`<script>window.MEMORY_DATA=${JSON.stringify(data).replace(/</g,'\\u003c')}</${'script'}>`;const oldCaption='.caption { position:absolute; z-index:4; left:clamp(20px,7vw,80px); right:clamp(20px,7vw,80px); bottom:8svh; display:flex; align-items:end; justify-content:space-between; gap:16px; pointer-events:none; }\n    .caption p { max-width:min(66%,380px); margin:0; color:#f8f1e4; font-size:clamp(15px,4vw,19px); font-weight:600; line-height:1.65; text-shadow:0 2px 10px #000; }';const newCaption='.caption { position:absolute; z-index:4; left:clamp(16px,7vw,80px); right:clamp(16px,7vw,80px); bottom:clamp(22px,3.5svh,48px); display:flex; flex-direction:column; align-items:center; justify-content:end; gap:10px; pointer-events:none; }\n    .caption p { width:min(100%,600px); min-height:calc(2.9em + 22px); margin:0; padding:10px 16px; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; color:#fffaf0; background:rgba(5,15,18,.78); border:1px solid rgba(242,197,107,.45); text-align:center; font-size:clamp(20px,5.2vw,28px); font-weight:600; line-height:1.45; text-shadow:0 2px 10px #000; }';const oldMobile='.caption { left:18px; right:18px; bottom:4svh; align-items:end; }\n      .caption p { max-width:210px; font-size:12px; }\n      .direction { font-size:11px; white-space:nowrap; }';const newMobile='.caption { left:14px; right:14px; bottom:max(20px,3svh); gap:8px; }\n      .caption p { width:100%; min-height:68px; padding:8px 13px; font-size:20px; line-height:1.4; }\n      .direction { font-size:12px; white-space:nowrap; }';return window.__VIEW_TEMPLATE__.replace(oldCaption,newCaption).replace(oldMobile,newMobile).replace('<script>',injection+'<script>')};
    $('preview').addEventListener('click',()=>{if(!save())return;if(matchMedia('(max-width:700px),(pointer:coarse)').matches){location.href='memory-preview.html';return}const preview=window.open('memory-preview.html','_blank');if(preview)preview.opener=null;else location.href='memory-preview.html'});
    $('export').addEventListener('click',()=>{const blob=new Blob([buildIndependentPage()],{type:'text/html;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='宝宝巴士-纪念日网页.html';link.click();URL.revokeObjectURL(link.href);toast('已导出：把下载的 HTML 发给对方即可')});
    const unlockEditor=()=>{$('editorGate').hidden=true;$('editorApp').hidden=false;sessionStorage.setItem(editorSessionKey,'ok');render()};
    $('editorGate').addEventListener('submit',event=>{event.preventDefault();if($('editorAccessCode').value!==editorAccessKey){$('editorGateError').textContent='密码不对，请重新输入。';$('editorAccessCode').select();return}$('editorGateError').textContent='';unlockEditor()});
    if(sessionStorage.getItem(editorSessionKey)==='ok')unlockEditor();
  </script>
  <script>window.__VIEW_TEMPLATE__="\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  \u003ctitle>宝宝巴士 | 记忆之旅\u003c/title>\n  \u003cstyle>\n    :root { --ink:#f8f1e4; --muted:#b7b9b5; --night:#071015; --night2:#0c1a20; --gold:#f2c56b; --line:rgba(248,241,228,.24); }\n    * { box-sizing:border-box; }\n    html { scroll-behavior:smooth; background:var(--night); }\n    body { margin:0; color:var(--ink); background:var(--night); font-family:\"Microsoft YaHei\",\"PingFang SC\",sans-serif; overflow-x:hidden; }\n    button,input { font:inherit; }\n    .chapter { min-height:100svh; position:relative; overflow:hidden; }\n    .chapter[hidden] { display:none; }\n    .grain { position:fixed; z-index:20; pointer-events:none; inset:0; opacity:.055; background-image:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 5px); mix-blend-mode:soft-light; }\n    .stars { position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle at 9% 17%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 83% 14%,#f2c56b 0 1px,transparent 1.7px),radial-gradient(circle at 68% 82%,#fff 0 1px,transparent 1.7px),radial-gradient(circle at 22% 67%,#f2c56b 0 1px,transparent 1.9px); background-size:230px 230px,310px 310px,280px 280px,360px 360px; opacity:.65; animation:stars 8s linear infinite; }\n    @keyframes stars { to { background-position:230px -230px,-310px 310px,280px -280px,-360px 360px; } }\n    .eyebrow { margin:0 0 14px; font-size:11px; letter-spacing:.24em; color:var(--gold); }\n    .display { font-family:\"Songti SC\",\"STSong\",serif; letter-spacing:.05em; font-weight:600; }\n    .copy { color:var(--muted); font-size:14px; line-height:1.85; }\n    .action { appearance:none; cursor:pointer; border:1px solid rgba(242,197,107,.7); color:#1d2a2c; background:var(--gold); border-radius:0; padding:13px 18px; font-size:13px; letter-spacing:.13em; transition:transform .2s, background .2s; }\n    .action:active { transform:scale(.97); }\n    .action:hover { background:#ffda89; }\n    .thin-action { color:var(--ink); background:transparent; border-color:var(--line); }\n    .rail { position:absolute; z-index:4; inset:0; border-left:1px solid rgba(242,197,107,.18); border-right:1px solid rgba(242,197,107,.18); width:min(100%,620px); margin:auto; pointer-events:none; }\n    .route { position:absolute; left:50%; top:0; bottom:0; width:1px; background:linear-gradient(transparent,rgba(242,197,107,.6),transparent); opacity:.45; }\n\n    /* boarding */\n    #board { min-height:100svh; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 115%,#294851 0%,#0e1b22 36%,#071015 74%); }\n    .bus-lights { position:absolute; inset:auto 0 18vh; height:2px; background:linear-gradient(90deg,transparent 4%,#f2c56b 24%,transparent 25%,transparent 75%,#f2c56b 76%,transparent 96%); box-shadow:0 0 30px #f2c56b; opacity:.7; }\n    .ticket { position:relative; z-index:2; width:min(86vw,390px); padding:27px 26px 24px; color:#143038; background:#f3ead8; clip-path:polygon(0 0,100% 0,100% 14%,97% 17%,100% 20%,100% 80%,97% 83%,100% 86%,100% 100%,0 100%,0 86%,3% 83%,0 80%,0 20%,3% 17%,0 14%); box-shadow:0 28px 80px #0009; transform:rotate(-2deg); }\n    .ticket::after { content:\"\"; position:absolute; top:14px; bottom:14px; right:38%; border-left:1px dashed #607071; }\n    .ticket h1 { margin:0; font-size:clamp(52px,16vw,78px); line-height:1; }\n    .ticket p { margin:11px 0; font-size:12px; letter-spacing:.13em; }\n    .ticket input { width:100%; border:0; border-bottom:1px solid #456169; padding:12px 0 9px; outline:none; background:transparent; color:#15343b; font:20px/1.2 monospace; letter-spacing:.45em; }\n    .ticket .action { margin-top:18px; width:100%; }\n    .error { min-height:18px; color:#b43c2e; font-size:12px; margin:9px 0 0; }\n    .ticket-stamp { position:absolute; z-index:4; top:24px; right:21px; display:grid; place-items:center; width:78px; height:78px; border:3px double #a44237; color:#a44237; font:700 14px/1 \"Songti SC\",serif; letter-spacing:.08em; opacity:0; transform:rotate(-17deg) scale(1.75); pointer-events:none; }\n    .ticket.stamped .ticket-stamp { animation:ticketStamp .42s cubic-bezier(.18,.88,.2,1) both; }\n    @keyframes ticketStamp { 0% { opacity:0; transform:rotate(-17deg) scale(1.75); } 72% { opacity:1; transform:rotate(-17deg) scale(.92); } 100% { opacity:.92; transform:rotate(-17deg) scale(1); } }\n    .ticket-stub { position:absolute; z-index:5; top:0; right:-1px; bottom:0; width:38%; display:grid; align-content:center; gap:8px; padding:18px 9px; color:#183940; background:#f3ead8; clip-path:polygon(0 0,100% 0,100% 14%,93% 18%,100% 22%,100% 78%,93% 82%,100% 86%,100% 100%,0 100%); opacity:0; pointer-events:none; }\n    .ticket-stub span { font:10px/1.45 monospace; letter-spacing:.08em; }\n    .ticket-stub b { color:#a44237; font:700 18px/1 \"Songti SC\",serif; letter-spacing:.12em; }\n    .ticket.tearing { animation:ticketRelease .78s cubic-bezier(.6,.05,.95,.5) both; }\n    .ticket.tearing::after { animation:tearLine .6s ease-out both; }\n    .ticket.tearing .ticket-stub { animation:stubRelease .78s cubic-bezier(.2,.8,.2,1) both; }\n    .ticket-stub.visible { opacity:1; }\n    @keyframes ticketRelease { 0% { transform:rotate(-2deg); } 22% { transform:rotate(-2deg) translateX(-7px); } 100% { opacity:0; transform:rotate(-7deg) translate(-80px,60px) scale(.72); } }\n    @keyframes stubRelease { 0% { transform:translateX(0); } 34% { transform:translateX(17px) rotate(3deg); } 100% { opacity:.82; transform:translate(120px,-42px) rotate(9deg) scale(.68); } }\n    @keyframes tearLine { 25% { border-color:#a44237; box-shadow:0 0 14px #a44237; } 100% { border-color:#a44237; box-shadow:0 0 2px #a44237; } }\n    #door { position:fixed; z-index:30; inset:0; pointer-events:none; display:none; transform:translateZ(0); }\n    #door.visible { display:flex; }\n    #door i { width:50%; background:#050b0e; border-color:#f2c56b55; transition:transform .9s cubic-bezier(.75,0,.2,1); }\n    #door i:first-child { border-right:1px solid #f2c56b55; }\n    #door i:last-child { border-left:1px solid #f2c56b55; }\n    #door.open i:first-child { transform:translateX(-100%); }\n    #door.open i:last-child { transform:translateX(100%); }\n\n    /* intro: two photos, one clear action */\n    #opening { display:grid; place-items:center; background:linear-gradient(155deg,#101e25,#162732 55%,#0a1318); }\n    #opening .rail { opacity:0; transform:scaleY(.08); transform-origin:bottom; }\n    #opening.route-begins .rail { animation:routeBegins .85s .1s cubic-bezier(.2,.85,.2,1) both; }\n    @keyframes routeBegins { to { opacity:1; transform:scaleY(1); } }\n    .opening-wrap { width:min(92vw,570px); height:100svh; display:grid; align-content:center; gap:20px; padding:26px 24px; }\n    .opening-head { position:relative; z-index:3; }\n    .opening-head h2 { margin:0; font-size:clamp(38px,10vw,66px); line-height:1.15; }\n    .memory-card { position:relative; height:min(50svh,430px); overflow:hidden; border:1px solid var(--line); background:var(--photo); box-shadow:0 22px 70px #0008; transform-origin:center; }\n    .memory-card::before { content:\"\"; position:absolute; inset:0; opacity:0; pointer-events:none; }\n    .memory-card::after { content:\"\"; position:absolute; inset:18px; border:1px solid #fff5; }\n    .photo-label,.photo-note { display:none; }\n    .memory-card.zoom-in { animation:fromDetail .75s cubic-bezier(.2,.8,.2,1); }\n    @keyframes fromDetail { from { transform:scale(1.08); opacity:.25; } to { transform:scale(1); opacity:1; } }\n    .opening-head .copy { font-size:clamp(16px,4vw,20px); font-weight:600; color:#f8f1e4; }\n    .direction { min-height:40px; color:#f5d685; font-size:12px; letter-spacing:.13em; text-align:center; transition:opacity .25s; }\n    .direction b { display:inline; margin-right:7px; border:0; font-size:18px; font-weight:400; }\n    .direction.pulse { animation:hintPulse 1.35s infinite; }\n    @keyframes hintPulse { 50% { transform:translateY(5px); opacity:.58; } }\n    .gate-trigger { display:none; }\n\n    /* full-window questions */\n    .gate { position:fixed; z-index:25; inset:0; display:none; place-items:center; padding:22px; background:rgba(3,10,13,.88); backdrop-filter:blur(11px); }\n    .gate.open { display:grid; animation:gateIn .45s both; }\n    @keyframes gateIn { from { opacity:0; clip-path:inset(45% 0); } to { opacity:1; clip-path:inset(0); } }\n    .gate-box { position:relative; width:min(100%,440px); border:1px solid rgba(242,197,107,.65); padding:30px 25px; text-align:center; background:#0b1a20; box-shadow:0 28px 90px #000; }\n    .gate-box h2 { margin:6px 0 10px; font-family:\"Songti SC\",serif; font-size:35px; }\n    .answers { display:grid; gap:9px; margin-top:20px; }\n    .answer { padding:13px; color:var(--ink); cursor:pointer; background:#122b32; border:1px solid #3a6064; text-align:left; transition:background .2s, transform .2s; }\n    .answer:hover { background:#1b3d45; transform:translateX(3px); }\n    .gate-feedback { min-height:26px; margin:15px 0 0; color:#f5d685; font-size:13px; }\n    .shards { display:flex; justify-content:center; gap:7px; margin:16px 0; }\n    .shard { display:grid; place-items:center; width:74px; height:42px; color:#15343a; background:#f3ead8; font-size:11px; animation:shard 1.8s ease-in-out infinite alternate; }\n    .shard:nth-child(2){animation-delay:.25s}.shard:nth-child(3){animation-delay:.5s}\n    @keyframes shard { to { transform:translateY(-5px) rotate(2deg); } }\n    .puzzle-box { max-width:460px; }\n    .puzzle-board { position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:18px auto 15px; width:min(82vw,340px); aspect-ratio:1.54; padding:7px; border:1px solid #527075; background:#071116; }\n    .puzzle-slot,.puzzle-piece { appearance:none; min-width:0; border:1px dashed #6b8b8c; background:#10282e; color:#f5d685; cursor:pointer; font:600 13px/1 \"Songti SC\",serif; transition:transform .2s, border-color .2s, box-shadow .2s, opacity .2s; }\n    .puzzle-slot { position:relative; }\n    .puzzle-slot::after { content:attr(data-slot); position:absolute; inset:0; display:grid; place-items:center; color:#7f9693; font:11px monospace; }\n    .puzzle-slot.filled { border-style:solid; border-color:var(--gold); background:var(--piece); box-shadow:inset 0 0 0 1px #fff4,0 0 18px #f2c56b44; }\n    .puzzle-slot.filled::after { content:\"\"; }\n    .puzzle-pieces { display:flex; justify-content:center; gap:9px; margin:0 auto; width:min(82vw,340px); }\n    .puzzle-piece { width:calc((min(82vw,340px) - 18px) / 3); aspect-ratio:1.42; background:var(--piece); box-shadow:0 9px 20px #0007; }\n    .puzzle-piece:nth-child(1) { transform:rotate(-4deg); }\n    .puzzle-piece:nth-child(2) { transform:translateY(-5px); }\n    .puzzle-piece:nth-child(3) { transform:rotate(4deg); }\n    .puzzle-piece.selected { border-color:#fff5c5; box-shadow:0 0 0 2px #f2c56b66,0 9px 22px #000; }\n    .puzzle-piece.placed { opacity:.22; pointer-events:none; transform:scale(.92); }\n    .puzzle-slot.wrong { animation:wrongPiece .32s linear; border-color:#c96a5d; }\n    .puzzle-complete { max-height:0; overflow:hidden; color:#f5d685; font-size:12px; transition:max-height .35s,margin .35s; }\n    #puzzleGate.complete .puzzle-complete { max-height:28px; margin-top:12px; }\n    @keyframes wrongPiece { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }\n    .puzzle-bridge { position:fixed; z-index:24; inset:0; display:grid; place-items:center; padding:24px; pointer-events:none; opacity:0; visibility:hidden; background:rgba(3,10,13,.84); transition:opacity .28s,visibility .28s; }\n    .puzzle-bridge.show { opacity:1; visibility:visible; }\n    .puzzle-bridge-photo { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; width:min(84vw,420px); aspect-ratio:1.54; padding:6px; border:1px solid #f2c56b99; background:#071116; box-shadow:0 20px 70px #000a; }\n    .puzzle-bridge-piece { background:var(--piece); background-size:300% 100%; animation:bridgePiece .75s cubic-bezier(.18,.88,.2,1) both; }\n    .puzzle-bridge-piece:nth-child(1){animation-delay:.04s}.puzzle-bridge-piece:nth-child(2){animation-delay:.13s}.puzzle-bridge-piece:nth-child(3){animation-delay:.22s}\n    @keyframes bridgePiece { from { opacity:0; transform:translateY(100px) rotate(10deg) scale(.7); } to { opacity:1; transform:none; } }\n\n    /* sticky photo chapters */\n    .gallery { min-height:100svh; display:grid; place-items:center; isolation:isolate; background:radial-gradient(circle at 50% 55%,#1b3c44,transparent 42%),#081217; touch-action:pan-y; }\n    .gallery::after { content:\"\"; position:absolute; z-index:-1; inset:0; background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(242,197,107,.23) 50%,transparent calc(50% + 1px)); opacity:.35; }\n    .gallery-title { position:absolute; z-index:3; left:clamp(20px,8vw,90px); top:max(20px,env(safe-area-inset-top)); }\n    .gallery-title h2 { margin:3px 0 0; font:600 clamp(25px,7vw,48px)/1.15 \"Songti SC\",serif; }\n    .counter { position:absolute; z-index:4; right:clamp(20px,8vw,90px); top:max(25px,env(safe-area-inset-top)); color:var(--gold); font:12px monospace; letter-spacing:.18em; }\n    .stage { position:relative; width:min(100vw,720px); height:100svh; overflow:hidden; touch-action:none; }\n    .photo { --photo:#3d706e; position:absolute; inset:15svh max(12px,6vw) 19svh; overflow:hidden; background:var(--photo); box-shadow:0 22px 70px #0008; transform-origin:center; }\n    .photo::before { content:\"\"; position:absolute; inset:0; opacity:0; pointer-events:none; }\n    .photo::after { content:\"\"; position:absolute; inset:17px; border:1px solid #fff5; }\n    .photo .number { display:none; }\n    .photo .replace { position:absolute; z-index:2; right:21px; bottom:21px; max-width:min(82%,320px); padding:10px 12px; text-align:right; color:#fff; background:rgba(4,12,16,.62); box-shadow:0 4px 16px #0005; font-size:clamp(16px,4vw,21px); font-weight:600; line-height:1.65; }\n    .photo.back { background:#f3ead8 !important; color:#17333a; animation:ticketFlip .62s both; }\n    .photo.back::before { opacity:1; background:repeating-linear-gradient(90deg,transparent 0 38px,#25495122 39px 40px),linear-gradient(#fff8,#e8d8ba); }\n    .photo.back::after { border-color:#32555a88; }\n    .photo.back .number { color:#27484c; font-size:18px; top:20px; bottom:auto; letter-spacing:.14em; }\n    .photo.back .replace { left:21px; right:21px; bottom:30px; max-width:none; color:#29464b; text-align:left; font:600 clamp(30px,8vw,52px)/1.25 \"Songti SC\",serif; }\n    .photo.back .photo-writing { display:none; }\n    .caption { position:absolute; z-index:4; left:clamp(20px,7vw,80px); right:clamp(20px,7vw,80px); bottom:8svh; display:flex; align-items:end; justify-content:space-between; gap:16px; pointer-events:none; }\n    .caption p { max-width:min(66%,380px); margin:0; color:#f8f1e4; font-size:clamp(15px,4vw,19px); font-weight:600; line-height:1.65; text-shadow:0 2px 10px #000; }\n    #travelCaption[hidden],#distanceCaption[hidden] { display:none; }\n    .gesture { flex:0 0 auto; pointer-events:auto; cursor:pointer; }\n    .gesture.hidden { opacity:0; }\n    .gesture b { font-size:20px; vertical-align:-1px; margin-right:4px; }\n    .photo.cover { animation:cover .65s cubic-bezier(.17,.76,.29,1) both; }\n    .photo.zoom { animation:photoZoom .72s cubic-bezier(.2,.8,.2,1) both; }\n    .photo.turn { animation:turn .7s cubic-bezier(.18,.8,.2,1) both; }\n    .photo.float { animation:float .72s cubic-bezier(.17,.9,.2,1) both; }\n    .photo.fade { animation:softFade .7s ease both; }\n    .photo.stack { animation:stack .7s cubic-bezier(.22,.8,.25,1) both; }\n    @keyframes cover { from { transform:translateY(105%) scale(.84); } to { transform:none; } }\n    @keyframes photoZoom { from { transform:scale(1.36); filter:blur(14px); opacity:0; } to { transform:none; filter:none; opacity:1; } }\n    @keyframes turn { from { transform:rotate(13deg) translateX(100%); opacity:0; } to { transform:none; opacity:1; } }\n    @keyframes float { from { transform:translateX(-110%) rotate(-9deg); opacity:0; } to { transform:none; opacity:1; } }\n    @keyframes softFade { from { opacity:0; } to { opacity:1; } }\n    @keyframes stack { from { transform:scale(.7) translateY(45%) rotate(-6deg); opacity:0; } to { transform:none; opacity:1; } }\n    .fog { position:absolute; z-index:3; inset:0; background:linear-gradient(105deg,#d9e4dbdd,#9db8bccc); transition:opacity .7s; }\n    .fog.clear { opacity:0; pointer-events:none; }\n    .tap-mark { position:absolute; z-index:5; right:8vw; top:18svh; width:44px; height:44px; border:1px solid #f2c56b; border-radius:50%; display:none; place-items:center; color:#f2c56b; animation:halo 1.2s infinite; }\n    .tap-mark.show { display:grid; }\n    @keyframes halo { 50% { box-shadow:0 0 0 11px transparent,0 0 0 1px #f2c56b; } }\n    .ticket-slip { position:absolute; z-index:4; right:8vw; top:20svh; display:none; width:120px; padding:11px; color:#19343a; background:#f3ead8; transform:rotate(8deg); font-size:11px; line-height:1.6; }\n    .ticket-slip.show { display:block; animation:ticketFlip .5s both; }\n    @keyframes ticketFlip { from { transform:rotateY(90deg) rotate(8deg); } to { transform:rotateY(0) rotate(8deg); } }\n    .arrival-lamp { position:absolute; z-index:8; top:18svh; right:9vw; display:none; width:62px; height:62px; border:1px solid #f7df9a; border-radius:50%; color:#172b2e; background:#536466; cursor:pointer; }\n    .arrival-lamp.show { display:grid; place-items:center; }\n    .arrival-lamp::before { content:\"到站\"; position:relative; z-index:2; font-size:11px; letter-spacing:.15em; }\n    .arrival-lamp.arrival-ready { color:#173238; background:var(--gold); box-shadow:0 0 0 9px #f2c56b18,0 0 0 18px #f2c56b0e,0 0 24px #f2c56b,0 0 78px #f2c56b99; animation:arrivalBeacon 1.45s ease-in-out infinite; }\n    .arrival-lamp.arrival-ready::after { content:\"点亮下一站\"; position:absolute; top:72px; right:-13px; width:90px; color:#f5d685; font-size:11px; letter-spacing:.08em; white-space:nowrap; text-shadow:0 2px 8px #000; }\n    .arrival-lamp.lit { background:#fff1ba; box-shadow:0 0 0 12px #f2c56b24,0 0 42px #fff1ba,0 0 96px #f2c56b; animation:none; }\n    @keyframes arrivalBeacon { 50% { transform:scale(1.12); box-shadow:0 0 0 14px #f2c56b0e,0 0 0 29px transparent,0 0 38px #f2c56b,0 0 96px #f2c56b; } }\n    .stamp-strip { position:absolute; z-index:7; right:clamp(18px,7vw,80px); top:62px; display:flex; gap:5px; }\n    .stamp { display:grid; place-items:center; width:19px; height:19px; border:1px solid rgba(248,241,228,.32); border-radius:50%; color:transparent; font:9px monospace; transition:background .3s, transform .3s; }\n    .stamp.done { color:#173038; border-color:var(--gold); background:var(--gold); transform:rotate(-10deg); }\n    .stage-flash { position:absolute; z-index:6; inset:0; pointer-events:none; opacity:0; background:radial-gradient(circle at 50% 50%,#fff9,transparent 23%); mix-blend-mode:screen; }\n    .stage-flash.fire { animation:stageFlash .55s ease-out both; }\n    @keyframes stageFlash { 0%{opacity:0} 35%{opacity:.9} 100%{opacity:0} }\n    .photo.archive::before { background:linear-gradient(90deg,#0004 1px,transparent 1px) 0 0/25px 100%,linear-gradient(#0004 1px,transparent 1px) 0 0/100% 25px,radial-gradient(circle at 22% 20%,#fff5,transparent 18%); }\n    .photo.ticket-entry { clip-path:polygon(0 0,100% 0,100% 14%,97% 19%,100% 24%,100% 76%,97% 81%,100% 86%,100% 100%,0 100%,0 86%,3% 81%,0 76%,0 24%,3% 19%,0 14%); }\n\n    /* the separated 8-16 chapter */\n    #distance { background:radial-gradient(circle at 50% 40%,#2b293d,transparent 38%),#0b1018; }\n    .dual .photo { inset:17svh auto 20svh; width:min(72vw,470px); }\n    .dual .photo.main { left:50%; transform:translateX(-50%); }\n    .dual .photo.side { left:4vw; width:25vw; height:16svh; top:18svh; bottom:auto; opacity:.72; filter:saturate(.75); }\n    .dual .photo.side .number { font-size:20px; left:10px; bottom:9px; }\n    .dual .photo.side .replace { display:none; }\n    .dual.converge #distanceMain,.dual.converge #distanceSide { inset:17svh auto 20svh; width:min(72vw,470px); height:auto; opacity:1; filter:none; }\n    .dual.converge #distanceMain { left:-65vw; transform:none; animation:convergeLeft .9s cubic-bezier(.2,.8,.2,1) both; }\n    .dual.converge #distanceSide { right:-65vw; left:auto; transform:none; animation:convergeRight .9s cubic-bezier(.2,.8,.2,1) both; }\n    .dual.converge #distanceMain .number,.dual.converge #distanceSide .number { font-size:clamp(38px,11vw,70px); }\n    .dual.converge.merged #distanceMain { left:50%; transform:translateX(-50%); animation:convergeFinal .46s cubic-bezier(.18,.88,.2,1) both; }\n    .dual.converge.merged #distanceSide { display:none; }\n    @keyframes convergeLeft { to { left:50%; transform:translateX(-60%); } }\n    @keyframes convergeRight { to { right:50%; transform:translateX(60%); } }\n    @keyframes convergeFinal { from { transform:translateX(-50%) scale(.9); filter:brightness(1.55); } to { transform:translateX(-50%) scale(1); filter:none; } }\n    .dual.ticket-mode .photo.main { clip-path:polygon(0 0,100% 0,100% 15%,97% 20%,100% 25%,100% 75%,97% 80%,100% 85%,100% 100%,0 100%,0 85%,3% 80%,0 75%,0 25%,3% 20%,0 15%); }\n    /* Distance photos stay centered after their entrance animation finishes. */\n    .dual:not(.split) .photo.main.cover { animation:dualCover .65s cubic-bezier(.17,.76,.29,1) both; }\n    .dual:not(.split) .photo.main.zoom { animation:dualZoom .72s cubic-bezier(.2,.8,.2,1) both; }\n    .dual:not(.split) .photo.main.turn { animation:dualTurn .7s cubic-bezier(.18,.8,.2,1) both; }\n    .dual:not(.split) .photo.main.float { animation:dualFloat .72s cubic-bezier(.17,.9,.2,1) both; }\n    .dual:not(.split) .photo.main.stack { animation:dualStack .7s cubic-bezier(.22,.8,.25,1) both; }\n    .dual:not(.split) .photo.main.fade { animation:dualFade .7s ease both; }\n    @keyframes dualCover { from { transform:translateX(-50%) translateY(105%) scale(.84); } to { transform:translateX(-50%); } }\n    @keyframes dualZoom { from { transform:translateX(-50%) scale(1.36); filter:blur(14px); opacity:0; } to { transform:translateX(-50%); filter:none; opacity:1; } }\n    @keyframes dualTurn { from { transform:translateX(-50%) rotate(13deg) translateX(100%); opacity:0; } to { transform:translateX(-50%); opacity:1; } }\n    @keyframes dualFloat { from { transform:translateX(-50%) translateX(-110%) rotate(-9deg); opacity:0; } to { transform:translateX(-50%); opacity:1; } }\n    @keyframes dualStack { from { transform:translateX(-50%) scale(.7) translateY(45%) rotate(-6deg); opacity:0; } to { transform:translateX(-50%); opacity:1; } }\n    @keyframes dualFade { from { transform:translateX(-50%); opacity:0; } to { transform:translateX(-50%); opacity:1; } }\n    .bridge { position:absolute; z-index:5; top:50%; left:50%; width:0; height:1px; background:var(--gold); box-shadow:0 0 24px var(--gold); transition:width .9s,left .9s; }\n    .bridge.join { left:0; width:100%; }\n    .click-ripple { position:fixed; z-index:60; width:14px; height:14px; margin:-7px; pointer-events:none; border:1px solid #fff0bc; border-radius:50%; box-shadow:0 0 0 1px #f2c56b88; animation:clickRipple .62s cubic-bezier(.12,.78,.18,1) both; }\n    @keyframes clickRipple { from { transform:scale(.4); opacity:.92; } to { transform:scale(7); opacity:0; } }\n\n    /* final recollection: all sixteen photos return once, then become one ticket */\n    .finale { position:fixed; z-index:40; inset:0; display:none; overflow:hidden; background:radial-gradient(circle at 50% 47%,#314b50 0%,#102025 30%,#061015 72%); }\n    .finale.show { display:block; animation:finaleIn .45s both; }\n    @keyframes finaleIn { from { opacity:0; } to { opacity:1; } }\n    .finale-route { position:absolute; left:50%; top:11svh; bottom:13svh; width:1px; background:linear-gradient(transparent,#f2c56b,transparent); box-shadow:0 0 22px #f2c56b; opacity:.72; }\n    .finale-copy { position:absolute; z-index:3; top:11svh; left:20px; right:20px; text-align:center; }\n    .finale-copy p { margin:0; color:#f5d685; font-size:12px; letter-spacing:.18em; }\n    .finale-copy h2 { margin:10px 0 0; color:var(--ink); font:600 clamp(28px,8vw,44px)/1.2 \"Songti SC\",serif; }\n    #memoryOrbit { position:absolute; inset:0; }\n    .reel-photo { position:absolute; z-index:2; left:calc(var(--x) * 1%); top:calc(var(--y) * 1%); width:clamp(47px,16vw,85px); aspect-ratio:.72; overflow:hidden; border:1px solid #fff7; background:var(--photo); box-shadow:0 14px 28px #0009; transform:translate(-50%,-50%) rotate(var(--r)) scale(.15); opacity:0; transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1),opacity .7s; animation:reelAppear .55s cubic-bezier(.17,.82,.25,1) calc(var(--delay) * 1ms) both; }\n    .reel-photo::after { content:\"\"; position:absolute; inset:5px; border:1px solid #fff5; }\n    .reel-photo span { position:absolute; z-index:2; left:6px; bottom:5px; color:#fff; font:10px monospace; text-shadow:0 1px 4px #000; }\n    @keyframes reelAppear { from { opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--r) - 14deg)) scale(.1); } to { opacity:1; transform:translate(-50%,-50%) rotate(var(--r)) scale(1); } }\n    .finale.fold .reel-photo { left:50%; top:50%; opacity:.12; transform:translate(-50%,-50%) rotate(0) scale(.1); }\n    .finale.fold .finale-route { animation:routeTicket .95s ease-in both; }\n    @keyframes routeTicket { to { transform:scaleX(290); opacity:0; } }\n\n    /* final */\n    #ending { display:grid; place-items:center; min-height:100svh; padding:35px 20px; text-align:center; background:radial-gradient(circle at 50% 43%,#27353d,transparent 37%),#0b1115; }\n    #ending[hidden] { display:none; }\n    .future-ticket { width:min(88vw,430px); color:#183239; background:#f3ead8; padding:28px 26px; text-align:left; box-shadow:0 22px 70px #0008; animation:arrive 1s cubic-bezier(.18,.88,.2,1) both; }\n    @keyframes arrive { from { transform:translateY(60px) scale(.85); opacity:0; } to { transform:none; opacity:1; } }\n    .future-ticket h2 { color:#193139; margin:3px 0 18px; font:600 clamp(37px,10vw,55px)/1.15 \"Songti SC\",serif; }\n    .future-ticket p { margin:0; padding:12px 0; border-top:1px dashed #7d8a86; color:#31484b; font-size:13px; }\n    .future-ticket b { color:#1f3435; }\n    #ending.arrival .eyebrow,#ending.arrival .future-ticket h2,#ending.arrival .future-ticket p { opacity:0; animation:ticketReveal .62s cubic-bezier(.2,.85,.2,1) both; }\n    #ending.arrival .eyebrow { animation-delay:.1s; }\n    #ending.arrival .future-ticket h2 { animation-delay:.42s; }\n    #ending.arrival .future-ticket p:nth-child(1) { animation-delay:.66s; }\n    #ending.arrival .future-ticket p:nth-child(3) { animation-delay:.88s; }\n    #ending.arrival .future-ticket p:nth-child(4) { animation-delay:1.04s; }\n    #ending.arrival .future-ticket p:nth-child(5) { animation-delay:1.2s; }\n    #ending.arrival .future-ticket p:nth-child(6) { animation-delay:1.36s; }\n    @keyframes ticketReveal { from { opacity:0; transform:translateY(13px); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }\n    .restart { margin-top:22px; color:var(--muted); background:none; border:0; cursor:pointer; font-size:12px; }\n    @media (max-width:520px) {\n      .ticket { width:calc(100vw - 34px); padding:24px 22px 21px; }\n      .ticket h1 { font-size:58px; }\n      .opening-wrap { padding:22px 17px; gap:15px; }\n      .opening-head h2 { font-size:38px; }\n      .memory-card { height:45svh; }\n      .gallery-title { left:18px; top:20px; }\n      .gallery-title h2 { font-size:31px; }\n      .counter { right:18px; top:26px; }\n      .photo { inset:14svh 13px 20svh; }\n      .photo .replace { right:17px; bottom:17px; max-width:82%; font-size:16px; }\n      .caption { left:18px; right:18px; bottom:4svh; align-items:end; }\n      .caption p { max-width:210px; font-size:12px; }\n      .direction { font-size:11px; white-space:nowrap; }\n      .gesture.pulse { animation:none; }\n      .dual .photo { width:78vw; }\n      .dual .photo.side { width:22vw; height:13svh; }\n      .gate-box { padding:27px 19px; }\n      .answer { min-height:48px; }\n    }\n    @media (min-width:760px) { .photo { inset-left:12vw; inset-right:12vw; } .opening-wrap { grid-template-columns:1fr 1.1fr; align-items:center; } .opening-head { order:2; } .memory-card { height:62svh; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"grain\">\u003c/div>\n  \u003cdiv id=\"door\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n\n  \u003cmain>\n    \u003csection id=\"board\" class=\"chapter\">\n      \u003cdiv class=\"stars\">\u003c/div>\u003cdiv class=\"bus-lights\">\u003c/div>\n      \u003cform id=\"boarding\" class=\"ticket\">\n        \u003cp id=\"boardingSerial\">MEMORY BUS / NIGHT 07\u003c/p>\n        \u003ch1 class=\"display\">宝宝巴士\u003c/h1>\n        \u003cp>请输入车票密码，今晚的车门只为这一段记忆打开。\u003c/p>\n        \u003cinput id=\"code\" type=\"password\" aria-label=\"车票密码\" inputmode=\"numeric\" autocomplete=\"off\" maxlength=\"12\" placeholder=\"输入车票密码\">\n        \u003cbutton class=\"action\" type=\"submit\">验票上车\u003c/button>\n        \u003cp id=\"codeError\" class=\"error\">\u003c/p>\n        \u003ci class=\"ticket-stamp\" aria-hidden=\"true\">已检票\u003c/i>\n        \u003ci id=\"ticketStub\" class=\"ticket-stub\" aria-hidden=\"true\">\u003cspan id=\"ticketStubSerial\">MEMORY BUS / STUB / NIGHT\u003c/span>\u003cb>已检票\u003c/b>\u003c/i>\n      \u003c/form>\n    \u003c/section>\n\n    \u003csection id=\"opening\" class=\"chapter\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\u003cdiv class=\"rail\">\u003c/div>\n      \u003cdiv class=\"opening-wrap\">\n        \u003cdiv class=\"opening-head\">\n          \u003cp class=\"eyebrow\">STORY BEGINS\u003c/p>\n          \u003ch2 class=\"display\">车门打开以后，\u003cbr>先是那一天。\u003c/h2>\n          \u003cp class=\"copy\" id=\"openCopy\">这里可以写下第一次见面时，最想留下的一句话。\u003c/p>\n        \u003c/div>\n        \u003cdiv id=\"openingCard\" class=\"memory-card zoom-in\" style=\"--photo:linear-gradient(135deg,#b25c5d,#5b2941)\">\n        \u003c/div>\n        \u003cp id=\"openingHint\" class=\"direction pulse\">\u003cb>←\u003c/b>轻划，翻到故事的另一面\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"travel\" class=\"chapter gallery\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\n      \u003cdiv class=\"gallery-title\">\u003cp class=\"eyebrow\">THE SAME SIDE OF THE WORLD\u003c/p>\u003ch2>天地一方\u003c/h2>\u003c/div>\n      \u003cdiv id=\"travelCounter\" class=\"counter\">01 / 07\u003c/div>\n      \u003cdiv id=\"travelStage\" class=\"stage\">\n        \u003cdiv id=\"travelPhoto\" class=\"photo\">\u003cspan class=\"number\">图片 01\u003c/span>\u003cspan class=\"replace\">把这一站的照片和一句话\u003cbr>放进这里\u003c/span>\u003c/div>\n        \u003cdiv id=\"travelFlash\" class=\"stage-flash\">\u003c/div>\n        \u003cdiv id=\"stampStrip\" class=\"stamp-strip\" aria-label=\"已到站记录\">\u003c/div>\n        \u003cdiv id=\"fog\" class=\"fog\">\u003c/div>\n        \u003cdiv id=\"tapMark\" class=\"tap-mark\">点\u003c/div>\n        \u003cdiv id=\"ticketSlip\" class=\"ticket-slip\">票根背面\u003cbr>[ 写下当时的一句话 ]\u003c/div>\n        \u003cdiv id=\"arrivalLamp\" class=\"arrival-lamp\" aria-label=\"点亮到站灯\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"caption\">\u003cp id=\"travelCaption\">雾还没有散开。先轻划，把这一站的画面从雾里带出来。\u003c/p>\u003cdiv id=\"travelHint\" class=\"direction gesture\">点击\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"distance\" class=\"chapter gallery\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\n      \u003cdiv class=\"gallery-title\">\u003cp class=\"eyebrow\">TWO PLACES, ONE DIRECTION\u003c/p>\u003ch2>天各一方\u003c/h2>\u003c/div>\n      \u003cdiv id=\"distanceCounter\" class=\"counter\">08 / 16\u003c/div>\n      \u003cdiv id=\"distanceStage\" class=\"stage dual\">\n        \u003cdiv id=\"distanceMain\" class=\"photo main\">\u003cspan class=\"number\">图片 08\u003c/span>\u003cspan class=\"replace\">这一站的照片\u003cbr>和一句想说的话\u003c/span>\u003c/div>\n        \u003cdiv id=\"distanceSide\" class=\"photo side\" hidden>\u003cspan class=\"number\">图片 08\u003c/span>\u003c/div>\n        \u003cdiv id=\"bridge\" class=\"bridge\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"caption\">\u003cp id=\"distanceCaption\">下一段故事，在另一座城市慢慢展开。\u003c/p>\u003cdiv id=\"distanceHint\" class=\"direction gesture\">左滑\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"ending\" class=\"chapter\" hidden>\n      \u003cdiv class=\"stars\">\u003c/div>\n      \u003cdiv>\n        \u003cp class=\"eyebrow\">NEXT STOP\u003c/p>\n        \u003cdiv class=\"future-ticket\">\n          \u003cp>有效期：一直\u003c/p>\n          \u003ch2 id=\"futureHeading\">下一站：幸福\u003c/h2>\n          \u003cp id=\"futureMessage\">[ 写给未来的一句话 ]\u003c/p>\n          \u003cp>\u003cb>目的地\u003c/b>　\u003cspan id=\"futureDestination\">[ 想一起去的地方 ]\u003c/span>\u003c/p>\n          \u003cp>\u003cb>下一件事\u003c/b>　\u003cspan id=\"futureNext\">[ 一个小约定 ]\u003c/span>\u003c/p>\n          \u003cp>\u003cb>再次打开\u003c/b>　\u003cspan id=\"futureReopen\">[ 一个值得纪念的日期 ]\u003c/span>\u003c/p>\n        \u003c/div>\n        \u003cbutton id=\"restart\" class=\"restart\">回到发车前\u003c/button>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"finale\" class=\"finale\" aria-live=\"polite\">\n    \u003cdiv class=\"stars\">\u003c/div>\u003cdiv class=\"finale-route\">\u003c/div>\n    \u003cdiv class=\"finale-copy\">\u003cp>MEMORY REEL / 01 - 16\u003c/p>\u003ch2>所有画面，都在驶向下一站。\u003c/h2>\u003c/div>\n    \u003cdiv id=\"memoryOrbit\" aria-label=\"十六张回望的照片\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"gateOne\" class=\"gate\" role=\"dialog\" aria-modal=\"true\">\n    \u003cdiv class=\"gate-box\">\n      \u003cp class=\"eyebrow\">FIRST CHECK\u003c/p>\u003ch2>第一站验证\u003c/h2>\n      \u003cp id=\"gateOneQuestion\" class=\"copy\">那天以后，这段旅程真正开始的原因是什么？\u003c/p>\n      \u003cdiv class=\"answers\">\u003cbutton class=\"answer\" data-gate=\"one\" data-option=\"1\">A. 因为刚好顺路\u003c/button>\u003cbutton class=\"answer\" data-gate=\"one\" data-option=\"2\">B. 因为想和你一直走下去\u003c/button>\u003cbutton class=\"answer\" data-gate=\"one\" data-option=\"3\">C. 因为这一晚没有别的安排\u003c/button>\u003cbutton class=\"answer\" data-gate=\"one\" data-option=\"4\">D. 因为车刚好经过这里\u003c/button>\u003c/div>\n      \u003cp id=\"gateOneFeedback\" class=\"gate-feedback\">\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"puzzleBridge\" class=\"puzzle-bridge\" aria-hidden=\"true\">\u003cdiv class=\"puzzle-bridge-photo\">\u003ci class=\"puzzle-bridge-piece\">\u003c/i>\u003ci class=\"puzzle-bridge-piece\">\u003c/i>\u003ci class=\"puzzle-bridge-piece\">\u003c/i>\u003c/div>\u003c/div>\n  \u003cdiv id=\"puzzleGate\" class=\"gate\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"puzzleTitle\">\n    \u003cdiv class=\"gate-box puzzle-box\">\n      \u003cp class=\"eyebrow\">ARRIVAL PUZZLE\u003c/p>\u003ch2 id=\"puzzleTitle\">先把这一站拼回来\u003c/h2>\n      \u003cp class=\"copy\">先点一块碎片，再点它该回到的位置。\u003c/p>\n      \u003cdiv class=\"puzzle-board\" aria-label=\"三块记忆拼图\">\n        \u003cbutton class=\"puzzle-slot\" type=\"button\" data-slot=\"1\" aria-label=\"拼图位置一\">\u003c/button>\n        \u003cbutton class=\"puzzle-slot\" type=\"button\" data-slot=\"2\" aria-label=\"拼图位置二\">\u003c/button>\n        \u003cbutton class=\"puzzle-slot\" type=\"button\" data-slot=\"3\" aria-label=\"拼图位置三\">\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"puzzle-pieces\" aria-label=\"可选择的拼图碎片\">\n        \u003cbutton class=\"puzzle-piece\" type=\"button\" data-piece=\"1\" aria-label=\"拼图碎片一\">01\u003c/button>\n        \u003cbutton class=\"puzzle-piece\" type=\"button\" data-piece=\"2\" aria-label=\"拼图碎片二\">02\u003c/button>\n        \u003cbutton class=\"puzzle-piece\" type=\"button\" data-piece=\"3\" aria-label=\"拼图碎片三\">03\u003c/button>\n      \u003c/div>\n      \u003cp id=\"puzzleFeedback\" class=\"gate-feedback\">完成 0 / 3\u003c/p>\n      \u003cp class=\"puzzle-complete\">拼好了。这段记忆已经回到原来的位置。\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"gateTwo\" class=\"gate\" role=\"dialog\" aria-modal=\"true\">\n    \u003cdiv class=\"gate-box\">\n      \u003cp class=\"eyebrow\">SECOND CHECK\u003c/p>\u003ch2>第二站验证\u003c/h2>\n      \u003cp id=\"gateTwoQuestion\" class=\"copy\">拼回这段记忆以后，下一段路要怎么走？\u003c/p>\n      \u003cdiv class=\"answers\">\u003cbutton class=\"answer\" data-gate=\"two\" data-option=\"1\">A. 到这里就够了\u003c/button>\u003cbutton class=\"answer\" data-gate=\"two\" data-option=\"2\">B. 下一段也要一起走\u003c/button>\u003cbutton class=\"answer\" data-gate=\"two\" data-option=\"3\">C. 等以后再说\u003c/button>\u003cbutton class=\"answer\" data-gate=\"two\" data-option=\"4\">D. 各自换一条路线\u003c/button>\u003c/div>\n      \u003cp id=\"gateTwoFeedback\" class=\"gate-feedback\">\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    (() => {\n      const $ = (id) => document.getElementById(id);\n      const memory = (() => {\n        try {\n          if (window.MEMORY_DATA) return window.MEMORY_DATA;\n          return {};\n        }\n        catch { return {}; }\n      })();\n      const palette = {\n        A:'linear-gradient(135deg,#b25c5d,#5b2941)', B:'linear-gradient(135deg,#e89b63,#a44945)',\n        1:'linear-gradient(135deg,#547d87,#162c3b)', 2:'linear-gradient(135deg,#d77d5c,#70403f)',\n        3:'linear-gradient(135deg,#86714b,#354334)', 4:'linear-gradient(135deg,#a4617d,#3e2846)',\n        5:'linear-gradient(135deg,#5d938c,#23414c)', 6:'linear-gradient(135deg,#bc9a50,#5b4630)',\n        7:'linear-gradient(135deg,#5c709d,#25294d)', 8:'linear-gradient(135deg,#7e748d,#302b45)',\n        9:'linear-gradient(135deg,#bd745f,#5a3345)', 10:'linear-gradient(135deg,#517c75,#253f43)',\n        11:'linear-gradient(135deg,#ae8d52,#504023)', 12:'linear-gradient(135deg,#6a789c,#303a58)',\n        13:'linear-gradient(135deg,#b66673,#522e3c)', 14:'linear-gradient(135deg,#455a75,#1c2639)',\n        15:'linear-gradient(135deg,#c99761,#60452f)', 16:'linear-gradient(135deg,#607d75,#2d4742)'\n      };\n      const travel = [\n        ['cover','图片 01 · 雾被拨开的那一刻。轻划让第一站从雾里出现。','←','拨开雾层'],\n        ['zoom','图片 02 · 先看见一个细节，再看见完整的那天。','←','拉近画面'],\n        ['turn','图片 03 · 这张照片像从旧相册里抽出来一样落下。','←','翻开相册'],\n        ['float','图片 04 · 点按照片，翻到票根背面，留下这一站的话。','点','翻看票根'],\n        ['stack','图片 05 · 前一站缩成小小一叠，新的画面从中抽出。','←','抽出下一张'],\n        ['archive','图片 06 · 色彩会在停留后慢慢回来。','←','让颜色回来'],\n        ['ticket-entry','图片 07 · 最后一站。点亮到站灯，拿到下一张车票。','点','点亮到站灯']\n      ];\n      const distance = [\n        ['main','','图片 08 · 另一座城市的第一束车窗光。','←','从左侧进入'],\n        ['main','8','图片 09 · 08 留在角落，09 来到正中。','←','从右侧覆盖'],\n        ['main','9','图片 10 · 新画面从中间展开，像一封刚拆开的信。','←','展开信件'],\n        ['main','10','图片 11 · 画面被切成几条，再重新拼回完整。','←','拼合画面'],\n        ['main','11','图片 12 · 不必藏起过去，只要继续往前。','←','继续向前'],\n        ['main','12','图片 13 · 城市从暗处一盏一盏亮起来。','←','点亮夜色'],\n        ['converge','','图片 14 · 同一张照片从两边靠近，最后合成一张完整画面。','←','看它汇合'],\n        ['ticket','','图片 15 · 两边的画面折成同一张准备出发的车票。','←','翻到车票'],\n        ['merge','','图片 16 · 这一段已经走完。向下，让两边汇合。','↓','向下汇合']\n      ];\n      const state = { opening:0, t:1, d:8, x:0, y:0, lastX:0, lastY:0, cool:false, travelBack:false, lockedId:null, mergeTimer:null, boarding:false, finaleStarted:false, puzzle:{selected:null,placed:new Set(),complete:false} };\n      const lockTo = (id) => {\n        state.lockedId = id;\n        const section = $(id);\n        window.scrollTo(0, section.offsetTop);\n      };\n      const show = (id) => { $(id).hidden = false; requestAnimationFrame(() => lockTo(id)); };\n      const setDirection = (target, symbol, words) => { target.innerHTML = `\u003cb>${symbol}\u003c/b>${words}`; target.classList.add('pulse'); };\n      const enter = () => {\n        if (state.boarding) return;\n        state.boarding = true;\n        const ticket = $('boarding');\n        const stub = $('ticketStub');\n        ticket.classList.add('stamped');\n        setTimeout(() => {\n          stub.classList.add('visible');\n          ticket.classList.add('tearing');\n        }, 520);\n        const door = $('door');\n        setTimeout(() => {\n          door.classList.add('visible');\n          requestAnimationFrame(() => requestAnimationFrame(() => door.classList.add('open')));\n        }, 1030);\n        setTimeout(() => {\n          door.classList.remove('visible','open');\n          $('board').hidden = true;\n          show('opening');\n          $('opening').classList.add('route-begins');\n        }, 1980);\n      };\n      $('boarding').addEventListener('submit', (event) => {\n        event.preventDefault();\n        if ($('code').value.trim() !== getBoardingCode()) { $('codeError').textContent = '车票密码不对，再想一想。'; return; }\n        $('codeError').textContent = '';\n        enter();\n      });\n\n      const memoryText = (number, fallback) => memory.text?.[String(number)]?.trim() || fallback;\n      const memoryImage = (number) => memory.images?.[String(number)] || '';\n      function getBoardingCode() {\n        const candidate = memoryText('boardingCode', '489978');\n        return /^[0-9]{4,12}$/.test(candidate) ? candidate : '489978';\n      }\n      const personalizeStaticCopy = () => {\n        $('boardingSerial').textContent = 'MEMORY BUS / NIGHT 07';\n        $('ticketStubSerial').textContent = 'MEMORY BUS / STUB / NIGHT';\n        $('code').placeholder = '输入车票密码';\n        $('code').maxLength = 12;\n        $('openCopy').textContent = memoryText('openingWords', '');\n        $('futureHeading').textContent = memoryText('endingTitle', '下一站：幸福');\n        $('futureMessage').textContent = memoryText('endingWords', '[ 写给未来的一句话 ]');\n        $('futureDestination').textContent = memoryText('destinationText', '[ 想一起去的地方 ]');\n        $('futureNext').textContent = memoryText('nextThingText', '[ 一个小约定 ]');\n        $('futureReopen').textContent = memoryText('reopenText', '[ 一个值得纪念的日期 ]');\n        const setQuestion = (gate, questionKey, optionPrefix, correctKey, questionFallback, optionFallbacks) => {\n          $(`gate${gate}Question`).textContent = memoryText(questionKey, questionFallback);\n          const answerNumber = Number(memoryText(correctKey, '2'));\n          const correct = Number.isInteger(answerNumber) && answerNumber >= 1 && answerNumber \u003c= 4 ? answerNumber : 2;\n          document.querySelectorAll(`[data-gate=\"${gate.toLowerCase().replace('one','one').replace('two','two')}\"]`).forEach((button) => {\n            const option = Number(button.dataset.option);\n            button.textContent = `${'ABCD'[option - 1]}. ${memoryText(`${optionPrefix}${option}`, optionFallbacks[option - 1])}`;\n            button.dataset.answer = option === correct ? 'right' : 'wrong';\n          });\n        };\n        setQuestion('One', 'firstQuestion', 'firstOption', 'firstCorrect', '那天以后，这段旅程真正开始的原因是什么？', ['因为刚好顺路','因为想和你一直走下去','因为这一晚没有别的安排','因为车刚好经过这里']);\n        setQuestion('Two', 'secondQuestion', 'secondOption', 'secondCorrect', '拼回这段记忆以后，下一段路要怎么走？', ['到这里就够了','下一段也要一起走','等以后再说','各自换一条路线']);\n      };\n      function applyPhotoBackground(photo, number) {\n        const image = memoryImage(number);\n        photo.style.setProperty('--photo', image ? `url(\"${image}\") center/cover` : palette[number]);\n      }\n      function paint(photo, number, effect, text, side=false) {\n        photo.className = `photo ${side ? 'side' : 'main'} ${effect || ''}`;\n        applyPhotoBackground(photo, number);\n        photo.innerHTML = '';\n      }\n      function setPuzzlePieceArt(element, index) {\n        const image = memoryImage('puzzle');\n        element.style.setProperty('--piece', image ? `url(\"${image}\")` : palette[7]);\n        element.style.backgroundSize = '300% 100%';\n        element.style.backgroundPosition = `${(index - 1) * 50}% 50%`;\n      }\n      function resetPuzzle() {\n        state.puzzle = {selected:null, placed:new Set(), complete:false};\n        const gate = $('puzzleGate');\n        gate.classList.remove('complete');\n        document.querySelectorAll('.puzzle-piece').forEach((piece) => {\n          piece.classList.remove('selected','placed');\n          setPuzzlePieceArt(piece, Number(piece.dataset.piece));\n        });\n        document.querySelectorAll('.puzzle-slot').forEach((slot) => {\n          slot.classList.remove('filled','wrong');\n          slot.style.removeProperty('--piece');\n          slot.style.removeProperty('background-size');\n          slot.style.removeProperty('background-position');\n        });\n        $('puzzleFeedback').textContent = '完成 0 / 3';\n      }\n      function openPuzzle() {\n        resetPuzzle();\n        $('puzzleBridge').classList.remove('show');\n        openGate('puzzleGate');\n      }\n      function startPuzzleBridge() {\n        document.querySelectorAll('.puzzle-bridge-piece').forEach((piece, index) => setPuzzlePieceArt(piece, index + 1));\n        const bridge = $('puzzleBridge');\n        bridge.classList.remove('show');\n        void bridge.offsetWidth;\n        bridge.classList.add('show');\n      }\n      const orbitPoints = [\n        [12,82,'-13deg'],[12,71,'-10deg'],[16,60,'-7deg'],[25,51,'-4deg'],\n        [37,45,'-1deg'],[50,42,'3deg'],[64,45,'6deg'],[75,51,'9deg'],\n        [83,60,'12deg'],[84,70,'9deg'],[78,80,'6deg'],[66,85,'3deg'],\n        [53,83,'-1deg'],[42,76,'-5deg'],[39,66,'-8deg'],[50,56,'-11deg']\n      ];\n      function buildMemoryOrbit() {\n        const orbit = $('memoryOrbit');\n        orbit.innerHTML = '';\n        orbitPoints.forEach(([x,y,rotation], index) => {\n          const photo = document.createElement('i');\n          photo.className = 'reel-photo';\n          photo.style.setProperty('--x', x);\n          photo.style.setProperty('--y', y);\n          photo.style.setProperty('--r', rotation);\n          photo.style.setProperty('--delay', 110 + index * 115);\n          applyPhotoBackground(photo, index + 1);\n          photo.innerHTML = '';\n          orbit.append(photo);\n        });\n      }\n      function startFinale() {\n        if (state.finaleStarted) return;\n        state.finaleStarted = true;\n        const finale = $('finale');\n        buildMemoryOrbit();\n        finale.classList.add('show');\n        setTimeout(() => finale.classList.add('fold'), 3220);\n        setTimeout(() => {\n          finale.classList.remove('show','fold');\n          show('ending');\n          $('ending').classList.add('arrival');\n        }, 4450);\n      }\n      function renderOpening() {\n        const isB = state.opening === 1;\n        const card = $('openingCard');\n        card.classList.remove('zoom-in'); void card.offsetWidth; card.classList.add('zoom-in');\n        applyPhotoBackground(card, isB ? 'B' : 'A');\n        card.innerHTML = '';\n        $('openCopy').textContent = memoryText('openingWords', '');\n        setDirection($('openingHint'), isB ? '↑' : '●', isB ? '上滑进入第一站' : '点击开启');\n      }\n      function openGate(id) { $(id).classList.add('open'); }\n      function renderTravel() {\n        const item = travel[state.t - 1];\n        state.travelBack=false;\n        paint($('travelPhoto'), state.t, item[0], '这里放入照片和这一站的文字');\n        $('travelPhoto').classList.toggle('ticket-entry', state.t === 7);\n        $('travelCounter').textContent = `${String(state.t).padStart(2,'0')} / 07`;\n        const travelWriting = memory.text?.[String(state.t)]?.trim() || '';\n        $('travelCaption').textContent = travelWriting;\n        $('travelCaption').hidden = !travelWriting || state.t === 4;\n        const travelPrompt = state.t === 1 ? ['●','点击散去雾气'] : state.t === 4 ? ['●','点击查看背面'] : state.t === 7 ? ['●','点击点亮站灯'] : state.t === 6 ? ['←','左滑前往下一站'] : ['←','左滑继续'];\n        setDirection($('travelHint'), travelPrompt[0], travelPrompt[1]);\n        $('stampStrip').innerHTML = Array.from({length:7}, (_,index) => `\u003ci class=\"stamp ${index \u003c state.t ? 'done' : ''}\">${index + 1}\u003c/i>`).join('');\n        $('travelFlash').classList.remove('fire'); void $('travelFlash').offsetWidth; $('travelFlash').classList.add('fire');\n        $('fog').classList.toggle('clear', state.t !== 1);\n        $('tapMark').classList.toggle('show', state.t === 4);\n        $('ticketSlip').classList.remove('show');\n        $('arrivalLamp').classList.toggle('show', state.t === 7);\n        $('arrivalLamp').classList.toggle('arrival-ready', state.t === 7);\n        $('arrivalLamp').classList.remove('lit');\n      }\n      function renderDistance() {\n        const frame = distance[state.d - 8];\n        const stage = $('distanceStage');\n        clearTimeout(state.mergeTimer);\n        stage.className = `stage dual ${frame[0] === 'converge' ? 'converge' : ''} ${frame[0] === 'ticket' ? 'ticket-mode' : ''}`;\n        const effect = frame[0] === 'converge' ? '' : ['cover','float','zoom','turn','stack','fade','cover','turn','zoom'][state.d - 8];\n        paint($('distanceMain'), state.d, effect, '这里放照片和一段文字');\n        if (frame[1]) { $('distanceSide').hidden=false; paint($('distanceSide'), frame[1], '', '', true); } else { $('distanceSide').hidden=true; }\n        if (frame[0] === 'converge') {\n          paint($('distanceMain'), 14, '', '同一张照片，从两边靠近。');\n          $('distanceSide').hidden=false;\n          paint($('distanceSide'), 14, '', '', true);\n          state.mergeTimer = setTimeout(() => {\n            if (state.d !== 14) return;\n            stage.classList.add('merged');\n            $('distanceSide').hidden=true;\n          }, 940);\n        }\n        if (frame[0] === 'merge') { $('distanceMain').style.transform='translateX(-50%) scale(.9)'; }\n        else { $('distanceMain').style.transform=''; }\n        $('distanceCounter').textContent = `${String(state.d).padStart(2,'0')} / 16`;\n        const distanceWriting = memory.text?.[String(state.d)]?.trim() || '';\n        $('distanceCaption').textContent = distanceWriting;\n        $('distanceCaption').hidden = !distanceWriting;\n        const distancePrompt = state.d === 8 ? ['←','左滑进入天各一方'] : state.d === 14 ? ['←','左滑让画面汇合'] : state.d === 15 ? ['←','左滑翻成车票'] : state.d === 16 ? ['↑','上滑前往终点'] : ['←','左滑继续'];\n        setDirection($('distanceHint'), distancePrompt[0], distancePrompt[1]);\n      }\n      function moveInChapter(chapter, endX, endY) {\n        if (state.cool) return;\n        const dx = endX - state.x, dy = endY - state.y;\n        if (Math.max(Math.abs(dx), Math.abs(dy)) \u003c 38) return;\n        state.cool=true; setTimeout(() => state.cool=false, 360);\n        if (chapter === 'travel' && Math.abs(dx) > Math.abs(dy)) {\n          if (dx \u003c 0 && state.t \u003c 7) { state.t++; renderTravel(); }\n          if (dx > 0 && state.t > 1) { state.t--; renderTravel(); }\n          return;\n        }\n        if (chapter === 'distance' && Math.abs(dx) > Math.abs(dy)) {\n          if (dx \u003c 0 && state.d \u003c 16) { state.d++; renderDistance(); }\n          if (dx > 0 && state.d > 8) { state.d--; renderDistance(); }\n          return;\n        }\n        if (chapter === 'opening' && state.opening === 1 && dy \u003c -38) openGate('gateOne');\n        if (chapter === 'distance' && state.d === 16 && dy \u003c -38) { $('bridge').classList.add('join'); startFinale(); }\n      }\n      function bindGestures(element, chapter) {\n        element.addEventListener('pointerdown', (event) => { state.x=event.clientX; state.y=event.clientY; state.lastX=event.clientX; state.lastY=event.clientY; });\n        element.addEventListener('pointermove', (event) => { state.lastX=event.clientX; state.lastY=event.clientY; });\n        element.addEventListener('pointerup', (event) => moveInChapter(chapter, event.clientX || state.lastX, event.clientY || state.lastY));\n        element.addEventListener('touchstart', (event) => {\n          const touch = event.changedTouches[0];\n          state.x = touch.clientX;\n          state.y = touch.clientY;\n          state.lastX = touch.clientX;\n          state.lastY = touch.clientY;\n        }, { passive:true });\n        element.addEventListener('touchmove', (event) => {\n          const touch = event.changedTouches[0];\n          state.lastX = touch.clientX;\n          state.lastY = touch.clientY;\n        }, { passive:true });\n        element.addEventListener('touchend', (event) => {\n          const touch = event.changedTouches[0];\n          moveInChapter(chapter, touch ? touch.clientX : state.lastX, touch ? touch.clientY : state.lastY);\n        }, { passive:false });\n      }\n      document.addEventListener('pointerdown', (event) => {\n        if (!event.target.closest('button,.gesture,.memory-card,.photo,.arrival-lamp,.tap-mark,.fog')) return;\n        const ripple = document.createElement('i');\n        ripple.className = 'click-ripple';\n        ripple.style.left = `${event.clientX}px`;\n        ripple.style.top = `${event.clientY}px`;\n        document.body.append(ripple);\n        setTimeout(() => ripple.remove(), 680);\n      }, true);\n      bindGestures($('opening'), 'opening');\n      bindGestures($('travelStage'), 'travel');\n      bindGestures($('distanceStage'), 'distance');\n      window.addEventListener('scroll', () => {\n        if (!state.lockedId) return;\n        const locked = $(state.lockedId);\n        if (!locked || locked.hidden) return;\n        if (Math.abs(window.scrollY - locked.offsetTop) > 2) window.scrollTo(0, locked.offsetTop);\n      }, { passive:true });\n      $('openingCard').addEventListener('click', () => { if (state.opening === 0) { state.opening=1; renderOpening(); } });\n      $('openingHint').addEventListener('click', () => { if (state.opening === 0) { state.opening=1; renderOpening(); } });\n      $('opening').addEventListener('wheel', (e) => { e.preventDefault(); if (state.opening === 1 && e.deltaY > 24) openGate('gateOne'); }, {passive:false});\n      $('travel').addEventListener('wheel', (e) => e.preventDefault(), {passive:false});\n      $('distance').addEventListener('wheel', (e) => e.preventDefault(), {passive:false});\n      $('fog').addEventListener('click', () => { $('fog').classList.add('clear'); });\n      $('travelPhoto').addEventListener('click', (event) => {\n        if (event.target.closest('[contenteditable]') || state.t !== 4) return;\n        const photo = $('travelPhoto');\n        state.travelBack = !state.travelBack;\n        photo.classList.toggle('back', state.travelBack);\n        $('tapMark').classList.toggle('show', !state.travelBack);\n        if (state.travelBack) {\n          photo.innerHTML = `\u003cspan class=\"number\">票根背面 / 图片 04\u003c/span>\u003cspan class=\"replace\">${memoryText(4, '这里写下那天最想留下的一句话')}\u003c/span>`;\n          $('travelCaption').hidden = true;\n          setDirection($('travelHint'), '●', '点击翻回照片');\n        } else {\n          renderTravel();\n        }\n      });\n      $('arrivalLamp').addEventListener('click', () => {\n        if (state.t !== 7) return;\n        $('arrivalLamp').classList.remove('arrival-ready');\n        $('arrivalLamp').classList.add('lit');\n        $('travelHint').classList.remove('pulse');\n        startPuzzleBridge();\n        setTimeout(openPuzzle, 1120);\n      });\n      document.querySelectorAll('.puzzle-piece').forEach((piece) => piece.addEventListener('click', () => {\n        if (piece.classList.contains('placed') || state.puzzle.complete) return;\n        document.querySelectorAll('.puzzle-piece').forEach((item) => item.classList.remove('selected'));\n        piece.classList.add('selected');\n        state.puzzle.selected = piece.dataset.piece;\n        $('puzzleFeedback').textContent = `已选中碎片 ${piece.dataset.piece}，点它该回去的位置。`;\n      }));\n      document.querySelectorAll('.puzzle-slot').forEach((slot) => slot.addEventListener('click', () => {\n        if (state.puzzle.complete) return;\n        const selected = state.puzzle.selected;\n        if (!selected) { $('puzzleFeedback').textContent = '先从下方选一块拼图。'; return; }\n        if (slot.dataset.slot !== selected) {\n          slot.classList.remove('wrong'); void slot.offsetWidth; slot.classList.add('wrong');\n          $('puzzleFeedback').textContent = '这块还没回到正确的位置，再试一次。';\n          return;\n        }\n        const piece = document.querySelector(`[data-piece=\"${selected}\"]`);\n        slot.classList.add('filled');\n        setPuzzlePieceArt(slot, Number(selected));\n        piece.classList.remove('selected');\n        piece.classList.add('placed');\n        state.puzzle.placed.add(selected);\n        state.puzzle.selected = null;\n        const count = state.puzzle.placed.size;\n        $('puzzleFeedback').textContent = `完成 ${count} / 3`;\n        if (count !== 3) return;\n        state.puzzle.complete = true;\n        $('puzzleGate').classList.add('complete');\n        setTimeout(() => {\n          $('puzzleGate').classList.remove('open');\n          openGate('gateTwo');\n        }, 1050);\n      }));\n      $('travelHint').addEventListener('click', () => {\n        if (state.t \u003c 7) { state.t++; renderTravel(); }\n      });\n      $('distanceHint').addEventListener('click', () => {\n        if (state.d \u003c 16) { state.d++; renderDistance(); return; }\n        $('bridge').classList.add('join');\n        startFinale();\n      });\n      document.querySelectorAll('.answer').forEach((button) => button.addEventListener('click', () => {\n        const right = button.dataset.answer === 'right';\n        const one = button.dataset.gate === 'one';\n        const feedback = $(one ? 'gateOneFeedback' : 'gateTwoFeedback');\n        if (!right) { feedback.textContent='还差一点。再看看这段旅程真正想留下的答案。'; return; }\n        feedback.textContent='答对了。这扇门为你打开。';\n        setTimeout(() => {\n          $(one ? 'gateOne' : 'gateTwo').classList.remove('open');\n          if (one) { show('travel'); renderTravel(); } else { show('distance'); renderDistance(); }\n        }, 620);\n      }));\n      $('restart').addEventListener('click', () => location.reload());\n      personalizeStaticCopy();\n      renderOpening();\n    })();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
